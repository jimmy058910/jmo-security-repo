# GitLab CI/CD Example for JMo Security
# This example demonstrates how to integrate JMo Security into GitLab pipelines
# using Docker images for zero-installation scanning.

variables:
  # Fail pipeline on HIGH or CRITICAL findings
  JMO_FAIL_ON: "HIGH"

  # One image carries every scanner (pin a version tag for reproducible runs)
  JMO_IMAGE: "jmogaming/jmo-security:latest"

stages:
  - security
  - compliance

# Template for JMo Security scans
.jmo_scan_template:
  image: ${JMO_IMAGE}
  before_script:
    - echo "Starting JMo Security scan"
  artifacts:
    when: always
    paths:
      - results/
    reports:
      sast: results/summaries/findings.sarif
    expire_in: 30 days
  cache:
    key: jmo-${CI_COMMIT_REF_SLUG}
    paths:
      - .jmo-cache/

# Quick scan for feature branches (pre-merge validation), narrowed with --tools
security:pr-scan:
  extends: .jmo_scan_template
  stage: security
  variables:
    JMO_FAIL_ON: ""  # Don't fail pipeline, just report
  script:
    - jmo scan --repo . --tools trufflehog semgrep trivy --results-dir results --human-logs
    - jmo report results --profile --human-logs
  only:
    - branches
  except:
    - main
    - master
    - tags

# Full scan for main/master branches and release tags.
# Every scanner is considered; the repository's content decides which run.
security:scan:
  extends: .jmo_scan_template
  stage: security
  script:
    - jmo scan --repo . --results-dir results --human-logs
    - jmo report results --fail-on ${JMO_FAIL_ON} --profile --human-logs
  only:
    - main
    - master
    - tags
  timeout: 2h

# Multi-target scan (repositories + containers + IaC)
security:multi-target-scan:
  extends: .jmo_scan_template
  stage: security
  script:
    - |
      jmo scan \
        --repo . \
        --image ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} \
        --terraform-state infrastructure/terraform.tfstate \
        --results-dir results \
        --human-logs
    - jmo report results --fail-on ${JMO_FAIL_ON} --profile --human-logs
  only:
    - schedules

# Compliance reporting (generate framework mappings)
compliance:report:
  extends: .jmo_scan_template
  stage: compliance
  dependencies:
    - security:scan
  script:
    - jmo report results --profile --human-logs
    - echo "Compliance reports generated:"
    - ls -lh results/summaries/COMPLIANCE_SUMMARY.md
    - ls -lh results/summaries/PCI_DSS_COMPLIANCE.md
    - ls -lh results/summaries/attack-navigator.json
  artifacts:
    when: always
    paths:
      - results/summaries/COMPLIANCE_SUMMARY.md
      - results/summaries/PCI_DSS_COMPLIANCE.md
      - results/summaries/attack-navigator.json
    expire_in: 90 days
  only:
    - main
    - master
    - tags

repos:
  # Basic sanity hooks (combined set)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Exclude multi-document YAML files (check-yaml only supports single docs)
        # - Kubernetes manifests with multiple resources
        # - Docker Compose files
        # - GitHub Actions workflow examples
        # - MkDocs config (uses !ENV tags not supported by standard YAML parser)
        # - Sample IaC files (CloudFormation uses !Ref tags, K8s has multi-doc)
        exclude: |
          (?x)^(
            tests/e2e/fixtures/iac/.*\.yaml|
            samples/iac-files/.*\.yaml|
            docker-compose\.yml|
            docs/examples/github-actions-docker\.yml|
            (docs/)?mkdocs\.yml
          )$
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
      - id: detect-private-key
        # Exclude test files with mock private keys (used to test redaction/parsing)
        exclude: |
          (?x)^(
            tests/unit/test_validation\.py|
            tests/adapters/test_noseyparker_adapter\.py|
            tests/fixtures/samples/credential-patterns/config\.py
          )$
      # Prevent committing very large files by mistake (limit also enforced by guardrails in CI)
      - id: check-added-large-files
        args: ["--maxkb=10240"]  # 10 MB

  # Strict YAML linting (schema-agnostic)
  # Note: Let pre-commit pass files instead of scanning "." to respect exclude patterns
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]
        # Exclude paths that may contain non-UTF-8 content or special YAML
        exclude: |
          (?x)^(
            results/|
            samples/|
            tests/e2e/fixtures/
          )

  # Validate GitHub Actions workflows
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Enable colorized output in local runs; CI may ignore colors
        args: ["-color"]

  # Markdown linting (cli2 shares .markdownlint-cli2.jsonc config with CI)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # Python format/lint (Black MUST run before Ruff per jmo-ci-debugger #15)
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        exclude: ^\.claude/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: ["--fix"]
        exclude: ^\.claude/

  # Type checking (optimized for incremental mode)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-croniter, types-requests, types-tabulate]
        args:
          - --config-file=pyproject.toml
          - scripts/
        pass_filenames: false
        require_serial: true

  # Security and shell formatting
  # Note: Using --format json avoids Windows cp1252 encoding issues with Unicode arrows
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (scripts only)
        args: ["-q", "-r", "scripts", "-c", "pyproject.toml", "--format", "json"]
        pass_filenames: false
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-S", "error", "-e", "SC2016,SC2028"]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt

  # Architecture enforcement hooks
  - repo: local
    hooks:
      - id: import-direction
        name: import-direction (check dependency layering)
        language: system
        types: [python]
        files: ^scripts/(core|jmo_mcp)/
        entry: python3 scripts/dev/check_import_direction.py
        pass_filenames: false
      - id: doc-links
        name: doc-links (validate documentation links)
        language: system
        files: ^(CLAUDE\.md|docs/)
        entry: python3 scripts/dev/check_doc_links.py
        pass_filenames: false
      - id: yaml-env-tilde
        name: "yaml-env-tilde (no literal ~/ in workflow env blocks)"
        language: system
        files: ^\.github/(workflows|actions)/.*\.ya?ml$
        entry: python3 scripts/dev/check_yaml_env_tilde.py
        pass_filenames: false

  # Local hook: keep uv.lock consistent with pyproject.toml.
  #
  # This is a LOCAL hook rather than astral-sh/uv-pre-commit on purpose:
  # maintenance.yml runs `pre-commit autoupdate` weekly, which would bump a
  # third-party hook's rev independently of the uv version pinned at every other
  # site — reintroducing exactly the resolver divergence this migration removed.
  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock (uv.lock matches pyproject.toml)
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        # Strategy: Check python first (Windows), then python3 (Unix), verify it's real Python not Windows stub
        # If none available, fail with clear error message
        entry: >-
          bash -c 'PY=""; for p in python python3; do
            if command -v "$p" >/dev/null 2>&1 && "$p" --version >/dev/null 2>&1; then PY="$p"; break; fi;
          done;
          [ -z "$PY" ] && { echo "ERROR: Python not found"; exit 1; };
          command -v uv >/dev/null 2>&1 || $PY -m pip install --quiet uv==0.11.15;
          uv lock --check ||
          { echo "ERROR: uv.lock is out of date with pyproject.toml.
          Run: make deps-lock"; exit 1; }'

  # Local hook: scan the locked dependency set for CVEs via pip-audit (OSV).
  # Calls the same script CI does, so a CVE-introducing dep bump fails locally
  # before it reaches CI (the 2026-04-15 Dependabot triage session hit 4 CVE
  # cascades mid-flight; catching at commit time prevents that).
  # Only runs when the dependency declaration or the lock changes.
  # Ignored advisories and their full reasoning live in the script.
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (CVE scan of uv.lock)
        language: python
        additional_dependencies: ["pip-audit>=2.9"]
        entry: bash scripts/dev/audit_deps.sh
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

# No `tools:` list: every scanner in scripts/core/tool_registry.py TOOL_MATRIX
# is eligible, and each target's content decides which of them run. Add a
# `tools:` list here (or pass --tools) to narrow it.
outputs:
- json
- md
- yaml
- html
- simple-html
- sarif
- csv
# compliance: COMPLIANCE_SUMMARY.md, PCI_DSS_COMPLIANCE.md, attack-navigator.json
# suppressions: SUPPRESSIONS.md, written when suppression rules are configured
# Both were written unconditionally before #867 and are listed here so removing
# one turns it off, which is what `outputs` means for every other entry.
- compliance
- suppressions
fail_on: ''
# Scan defaults. There are no profiles (v2.0.0); these are the settings the
# former default profile (balanced) used, plus the yara and grype entries only
# the former deep profile carried.
threads: 4
timeout: 600
per_tool:
  semgrep:
    flags:
    - --exclude
    - node_modules
    - --exclude
    - .git
  trivy:
    flags:
    - --no-progress
  zap:
    flags:
    - -config
    - api.disablekey=true
    - -config
    - spider.maxDuration=5
  nuclei:
    timeout: 600
    flags:
    - -severity
    - critical,high,medium
  yara:
    timeout: 900
    # No flags by default. This shipped `--max-rules-per-file=500`, which is
    # not a yara option: v4.5.8 defines `max-rules` and
    # `max-strings-per-rule`, and nothing of that name. The scanner would
    # have been rejected on an unknown option had it ever got far enough to
    # run. Set `rules_path` here to point at your own rule set; otherwise
    # the bundle installed by `jmo tools install yara` is used.
  grype:
    timeout: 900
profiling:
  min_threads: 2
  max_threads: 8
  default_threads: 4
# Deduplication Configuration (cross-tool finding clustering)
deduplication:
  similarity_threshold: 0.65   # 0.5-1.0 (lower = more aggressive clustering)
# Policy-as-Code Configuration (Feature #5, v1.0.0)
policy:
  enabled: true                  # Enable policy evaluation
  auto_evaluate: true             # Auto-evaluate after scans
  default_policies:               # Policies to apply by default
  - owasp-top-10
  - zero-secrets
  fail_on_violation: false        # Fail CI/CD if violations found
  opa:
    binary: opa                   # Path to OPA binary
    version: ">=0.70.0"           # Minimum OPA version
    timeout: 30                   # Policy evaluation timeout (seconds)

    - audit
    likelihood: LOW
    impact: MEDIUM
  languages:
  - typescript
  - javascript
  severity: WARNING
  mode: taint
  pattern-sources:
  - label: TAINTED
    patterns:
    - pattern-either:
      - pattern-inside: 'function ...({..., $X, ...}) { ... }

          '
      - pattern-inside: 'function ...(..., $X, ...) { ... }

          '
    - focus-metavariable: $X
    - pattern-either:
      - pattern: $X.$Y
      - pattern: $X[...]
    - pattern-not-inside: '$F. ... .$SANITIZEUNC(...)

        '
  - label: CONCAT
    requires: TAINTED
    patterns:
    - pattern-either:
      - pattern: '`...${$X}...`

          '
      - pattern: '$SANITIZE + <... $X ...>

          '
    - pattern-not: '`${$X}...`

        '
    - pattern-not: '$X + ...


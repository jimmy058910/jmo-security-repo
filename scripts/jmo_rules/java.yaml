  metadata:
    cwe: 'CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)'
    owasp: 'A9: Using Components with Known Vulnerabilities'
    references:
    - https://www.elttam.com/blog/cracking-randomness-in-java/
    category: security
    subcategory: audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
    technology:
    - Java
    - Apache Commons Lang
    - RandomStringUtils
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: 'org.apache.commons.lang3.RandomStringUtils.$X(...)

      '
  - pattern-not-inside: 'org.apache.commons.lang3.RandomStringUtils.$X(..., new SecureRandom())

      '

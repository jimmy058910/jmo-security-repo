rules:
- id: 0xdea.c.argv-envp-access.raptor-argv-envp-access
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - audit
    vulnerability_class: Other Security
    likelihood: LOW
    impact: LOW
    confidence: MEDIUM
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-15: External Control of System or Configuration Setting'
    owasp:
    - A05:2025 - Injection
    references:
    - https://www.gnu.org/software/libc/manual/html_node/Program-Arguments.html
  message: The program accesses command-line arguments or environment variables, which
    are controlled by potential attackers.
  severity: INFO
  languages:
  - c
  - cpp
  patterns:
  - pattern-either:
    - pattern: argv
    - pattern: envp
- id: 0xdea.c.command-injection.raptor-command-injection
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - vuln
    vulnerability_class: Command Injection
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS
      Command Injection'')'
    - 'CWE-88: Improper Neutralization of Argument Delimiters in a Command (''Argument
      Injection'')'
    - 'CWE-676: Use of Potentially Dangerous Function'
    owasp:
    - A05:2025 - Injection
    references:
    - https://g.co/kgs/PCHQjJ
    - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
  message: The software constructs an OS command using externally-influenced input,  but
    it does not neutralize or incorrectly neutralizes special elements  that could
    modify the intended OS command.
  severity: ERROR
  languages:
  - c
  - cpp
  patterns:
  - pattern-either:
    - pattern: system(...)
    - pattern: popen(...)
    - pattern: p2open(...)
    - pattern: wordexp(...)
  - pattern-not: $_("...", ...)
- id: 0xdea.c.double-free.raptor-double-free
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - vuln
    vulnerability_class: Memory Issues
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-415: Double Free'
    owasp:
    - A10:2025 - Mishandling of Exceptional Conditions
    references:
    - https://github.com/struct/mms
    - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
    - https://docs.microsoft.com/en-us/cpp/sanitizers/asan-error-examples
    - https://dustri.org/b/playing-with-weggli.html
  message: The software calls free() twice on the same memory address, potentially  leading
    to memory corruption. This corruption can cause the program to  crash or cause
    two later calls to malloc() to return the same pointer.
  severity: ERROR
  languages:
  - c
  - cpp
  patterns:
  - pattern: '$FREE1($PTR);

      ...

      $FREE2($PTR);

      '
  - pattern-not: '$FREE1($PTR);

      ...

      $PTR = ...;

      ...

      $FREE2($PTR);

      '
  - metavariable-pattern:
      metavariable: $FREE1
      pattern: free
  - metavariable-pattern:
      metavariable: $FREE2
      pattern: free
  - focus-metavariable: $FREE2
- id: 0xdea.c.format-string-bugs.raptor-format-string-bugs
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - vuln
    vulnerability_class: Memory Issues
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-134: Use of Externally-Controlled Format String'
    owasp:
    - A05:2025 - Injection
    references:
    - https://julianor.tripod.com/bc/formatstring-1.2.pdf
    - http://phrack.org/issues/70/13.html#article
    - https://g.co/kgs/PCHQjJ
    - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
  message: The software uses a function that accepts a format string as an argument,
    but the format string originates from an external source. This can lead  to buffer
    overflows, denial of service, or data representation problems.
  severity: ERROR
  languages:
  - c
  - cpp
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: printf(...)
      - pattern: vprintf(...)
      - pattern: wprintf(...)
      - pattern: vwprintf(...)
      - pattern: vcprintf(...)
      - pattern: vcwprintf(...)
      - pattern: vscprintf(...)
      - pattern: vscwprintf(...)
      - pattern: printk(...)
      - pattern: scanf(...)
      - pattern: __isoc99_scanf(...)
      - pattern: vscanf(...)
      - pattern: __isoc99_vscanf(...)
      - pattern: wscanf(...)
      - pattern: vwscanf(...)
      - pattern: warn(...)
      - pattern: vwarn(...)
      - pattern: warnx(...)
      - pattern: vwarnx(...)
    - pattern-not: $_("...", ...)
    - pattern-not: $_(gettext(...), ...)
    - pattern-not: $_(dgettext(...), ...)
    - pattern-not: $_(dcgettext(...), ...)
  - patterns:
    - pattern-either:
      - pattern: fprintf(...)
      - pattern: vfprintf(...)
      - pattern: fwprintf(...)
      - pattern: vfwprintf(...)
      - pattern: sprintf(...)
      - pattern: vsprintf(...)
      - pattern: asprintf(...)
      - pattern: vasprintf(...)
      - pattern: dprintf(...)
      - pattern: vdprintf(...)
      - pattern: wsprintf(...)
      - pattern: fscanf(...)
      - pattern: __isoc99_fscanf(...)
      - pattern: vfscanf(...)
      - pattern: __isoc99_vfscanf(...)
      - pattern: fwscanf(...)
      - pattern: vfwscanf(...)
      - pattern: sscanf(...)
      - pattern: __isoc99_sscanf(...)
      - pattern: vsscanf(...)
      - pattern: __isoc99_vsscanf(...)
      - pattern: swscanf(...)
      - pattern: vswscanf(...)
      - pattern: syslog(...)
      - pattern: vsyslog(...)
      - pattern: err(...)
      - pattern: verr(...)
      - pattern: errx(...)
      - pattern: verrx(...)
      - pattern: warnc(...)
      - pattern: vwarnc(...)
    - pattern-not: $_($_, "...", ...)
    - pattern-not: $_($_, gettext(...), ...)
    - pattern-not: $_($_, dgettext(...), ...)
    - pattern-not: $_($_, dcgettext(...), ...)
  - patterns:
    - pattern-either:
      - pattern: snprintf(...)
      - pattern: vsnprintf(...)
      - pattern: swprintf(...)
      - pattern: vswprintf(...)
      - pattern: errc(...)
      - pattern: verrc(...)
    - pattern-not: $_($_, $_, "...", ...)
    - pattern-not: $_($_, $_, gettext(...), ...)
    - pattern-not: $_($_, $_, dgettext(...), ...)
    - pattern-not: $_($_, $_, dcgettext(...), ...)
- id: 0xdea.c.high-entropy-assignment.raptor-high-entropy-assignment
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - audit
    vulnerability_class: Hard-coded Secrets
    likelihood: LOW
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-540: Inclusion of Sensitive Information in Source Code'
    owasp:
    - A06:2025 - Insecure Design
    references:
    - https://semgrep.dev/docs/writing-rules/metavariable-analysis
    - https://github.com/semgrep/semgrep/pull/4672
  message: Entropy, or randomness, is a common approach for detecting secret strings.
    If an assignment has high entropy, it might involve a secret that should not be
    accessible to users.
  severity: INFO
  languages:
  - c
  - cpp
  patterns:
  - pattern: $_ = "$X"
  - metavariable-analysis:
      analyzer: entropy
      metavariable: $X
- id: 0xdea.c.incorrect-order-setuid-setgid.raptor-incorrect-order-setuid-setgid
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - vuln
    vulnerability_class: Improper Authorization
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-696: Incorrect Behavior Order'
    owasp:
    - A01:2025 - Broken Access Control
    references:
    - https://www.usenix.org/legacy/events/sec02/full_papers/chen/chen.pdf
    - https://g.co/kgs/PCHQjJ
    - https://github.com/struct/mms
  message: A compromised process might be able to regain elevated group privileges
    if set(e)gid() is called after set(e)uid(). A similar case is when  privileges
    are temporarily dropped with seteuid() and then setuid() or  seteuid() are called
    from while under unprivileged user.
  severity: ERROR
  languages:
  - c
  - cpp
  pattern-either:
  - patterns:
    - pattern: '<... setuid(...) ...>;

        ...

        <... setgid(...) ...>;

        '
    - pattern-not: '<... setuid(0) ...>;

        ...

        <... setgid(...) ...>;

        '
  - patterns:
    - pattern: '<... seteuid(...) ...>;

        ...

        <... setegid(...) ...>;

        '
    - pattern-not: '<... seteuid(0) ...>;

        ...

        <... setegid(...) ...>;

        '
    - pattern-not-inside: '<... seteuid(...) ...>;

        ...

        <... seteuid(0) ...>;

        ...

        <... setegid(...) ...>;

        '
  - patterns:
    - pattern: '<... seteuid(...) ...>;

        ...

        <... setuid(...) ...>;

        '
    - pattern-not: '<... seteuid(0) ...>;

        ...

        <... setuid(...) ...>;

        '
    - pattern-not-inside: '<... seteuid(...) ...>;

        ...

        <... seteuid(0) ...>;

        ...

        <... setuid(...) ...>;

        '
  - patterns:
    - pattern: '<... seteuid(...) ...>;

        ...

        <... seteuid(...) ...>;

        '
    - pattern-not: '<... seteuid(0) ...>;

        ...

        <... seteuid(...) ...>;

        '
    - pattern-not: '<... seteuid(...) ...>;

        ...

        <... seteuid(0) ...>;

        '
    - pattern-not-inside: '<... seteuid(...) ...>;

        ...

        <... seteuid(0) ...>;

        ...

        <... seteuid(...) ...>;

        '
- id: 0xdea.c.incorrect-unsigned-comparison.raptor-incorrect-unsigned-comparison
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - audit
    vulnerability_class: Improper Validation
    likelihood: LOW
    impact: MEDIUM
    confidence: HIGH
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-697: Incorrect Comparison'
    owasp:
    - A10:2025 - Mishandling of Exceptional Conditions
    references:
    - https://g.co/kgs/PCHQjJ
  message: Checking if an unsigned variable is negative makes no sense and is usually
    a good indication that something is probably wrong with the code.
  severity: WARNING
  languages:
  - c
  - cpp
  pattern-either:
  - pattern: (unsigned short $_) < 0
  - pattern: (unsigned short int $_) < 0
  - pattern: (unsigned int $_) < 0
  - pattern: (unsigned long $_) < 0
  - pattern: (unsigned long int $_) < 0
  - pattern: (size_t $_) < 0
  - pattern: (unsigned short $_) <= 0
  - pattern: (unsigned short int $_) <= 0
  - pattern: (unsigned int $_) <= 0
  - pattern: (unsigned long $_) <= 0
  - pattern: (unsigned long int $_) <= 0
  - pattern: (size_t $_) <= 0
  - pattern: (unsigned short $_) >= 0
  - pattern: (unsigned short int $_) >= 0
  - pattern: (unsigned int $_) >= 0
  - pattern: (unsigned long $_) >= 0
  - pattern: (unsigned long int $_) >= 0
  - pattern: (size_t $_) >= 0
- id: 0xdea.c.incorrect-use-of-free.raptor-incorrect-use-of-free
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - vuln
    vulnerability_class: Memory Issues
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-590: Free of Memory not on the Heap'
    owasp:
    - A10:2025 - Mishandling of Exceptional Conditions
    references:
    - https://github.com/shellphish/how2heap/blob/master/glibc_2.23/house_of_spirit.c
  message: The software calls free() on a pointer to memory that has a short  lifetime
    and was not allocated using associated heap allocation  functions such as malloc(),
    calloc(), or realloc().
  severity: ERROR
  languages:
  - c
  - cpp
  pattern-either:
  - patterns:
    - pattern: free($PTR)
    - pattern-either:
      - pattern-inside: '$_ $PTR[$_];

          ...

          '
      - pattern-inside: '$_ $PTR[$_] = ...;

          ...

          '
      - pattern-inside: '$_ $PTR[] = ...;

          ...

          '
      - pattern-inside: '$_ $ARR[$_];

          ...

          $PTR = $ARR;

          ...

          '
      - pattern-inside: '$_ $ARR[$_] = ...;

          ...

          $PTR = $ARR;

          ...

          '
      - pattern-inside: '$_ $ARR[] = ...;

          ...

          $PTR = $ARR;

          ...

          '
  - patterns:
    - pattern: free(&$VAR)
    - pattern-either:
      - pattern-inside: '$_ $VAR;

          ...

          '
      - pattern-inside: '$_ $VAR = ...;

          ...

          '
      - pattern-inside: '$_ $VAR[$_];

          ...

          '
      - pattern-inside: '$_ $VAR[$_] = ...;

          ...

          '
      - pattern-inside: '$_ $VAR[] = ...;

          ...

          '
      - pattern-inside: '$_ * $VAR;

          ...

          '
      - pattern-inside: '$_ * $VAR = ...;

          ...

          '
- id: 0xdea.c.incorrect-use-of-memset.raptor-incorrect-use-of-memset
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - vuln
    vulnerability_class: Mishandled Sensitive Information
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-683: Function Call With Incorrect Order of Arguments'
    owasp:
    - A04:2025 - Cryptographic Failures
    references:
    - https://lkml.org/lkml/2009/11/11/336
    - https://bugs.mysql.com/bug.php?id=23181
  message: The invocation of memset() is easy to get wrong. The second argument is
    the character and the third argument is the size, but sometimes these arguments
    are in the wrong order. This results in a no-op.
  severity: ERROR
  languages:
  - c
  - cpp
  pattern-either:
  - pattern: memset($_, $_, 0)
  - pattern: memset($_, $_, '\0')
  - pattern: memset($_, sizeof(...), $_)
  - pattern: memset_explicit($_, $_, 0)
  - pattern: memset_explicit($_, $_, '\0')
  - pattern: memset_explicit($_, sizeof(...), $_)
- id: 0xdea.c.incorrect-use-of-sizeof.raptor-incorrect-use-of-sizeof
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - vuln
    vulnerability_class: Memory Issues
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-467: Use of sizeof() on a Pointer Type'
    owasp:
    - A10:2025 - Mishandling of Exceptional Conditions
    references:
    - https://g.co/kgs/PCHQjJ
    - https://github.com/struct/mms
    - https://dustri.org/b/playing-with-weggli.html
    - https://mastodon.gamedev.place/@amonakov/111577826195014479
    - https://github.com/semgrep/semgrep/issues/11327
  message: The code calls sizeof() on a pointer type, which always returns  the wordsize
    (8 on 64-bit architectures). This can produce an  unexpected result if the programmer
    intended to determine how  much memory has been allocated.
  severity: WARNING
  languages:
  - c
  - cpp
  pattern-either:
  - patterns:
    - pattern: sizeof((char * $_))
    - pattern-not: sizeof("...")
  - pattern: sizeof((int * $_))
  - pattern: sizeof((float * $_))
  - pattern: sizeof((double * $_))
  - patterns:
    - pattern-either:
      - pattern: sizeof($PTR)
      - pattern: sizeof($PTR + $_)
      - pattern: sizeof($_ + $PTR)
    - pattern-either:
      - pattern-inside: '$_ * $PTR;

          ...

          '
      - pattern-inside: '$_ * $PTR = ...;

          ...

          '
  - patterns:
    - pattern-either:
      - pattern: sizeof($PTR)
      - pattern: sizeof($PTR + $_)
      - pattern: sizeof($_ + $PTR)
    - pattern-either:
      - pattern-inside: "$_ $_(..., $_ * $PTR, ...) {\n    ...\n}\n"
      - pattern-inside: "$_ $_(..., $_ $PTR[$_], ...) {\n    ...\n}\n"
      - pattern-inside: "$_ $_(..., $_ $PTR[], ...) {\n    ...\n}\n"
  - pattern: sizeof(this)
- id: 0xdea.c.incorrect-use-of-strncat.raptor-incorrect-use-of-strncat
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - vuln
    vulnerability_class: Memory Issues
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-787: Out-of-bounds Write'
    - 'CWE-193: Off-by-one Error'
    owasp:
    - A10:2025 - Mishandling of Exceptional Conditions
    references:
    - https://g.co/kgs/PCHQjJ
  message: 'The strncat() function is nearly as dangerous as strcat(), in that it''s
    quite easy to misuse. The first common mistake is supplying the size of  the entire
    buffer instead of the size remaining in the buffer. A more  subtle mistake can
    be made: the size parameter needs to be the amount of space left in the buffer
    less one; otherwise, the NUL byte is written  one byte past the end of the buffer.'
  severity: ERROR
  languages:
  - c
  - cpp
  pattern-either:
  - patterns:
    - pattern: strncat($DST, $_, $LEN)
    - pattern-either:
      - pattern-inside: '$_ $DST[$LEN];

          ...

          '
      - pattern-inside: '$_ $DST[$LEN] = ...;

          ...

          '
  - pattern: strncat($DST, $_, sizeof($DST))
  - pattern: strncat($DST, $_, strlen($DST))
  - pattern: strncat($DST, $_, sizeof($DST) - strlen($DST))
- id: 0xdea.c.insecure-api-access-stat.raptor-insecure-api-access-stat
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - audit
    vulnerability_class: Dangerous Method or Function
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition'
    owasp:
    - A10:2025 - Mishandling of Exceptional Conditions
    references:
    - https://g.co/kgs/PCHQjJ
    - https://labs.snyk.io/resources/leaky-vessels-container-vuln-deep-dive/
  message: The software checks the state of a resource before using it, but the  resource's
    state can change between the check and the use in a way that  invalidates the
    results of the check. This can cause the software to  perform invalid actions
    when the resource is in an unexpected state.
  severity: WARNING
  languages:
  - c
  - cpp
  pattern-either:
  - pattern: access(...)
  - pattern: faccessat(...)
  - pattern: faccessat2(...)
  - pattern: stat(...)
  - pattern: lstat(...)
  - pattern: fstatat(...)
- id: 0xdea.c.insecure-api-alloca.raptor-insecure-api-alloca
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - vuln
    vulnerability_class: Dangerous Method or Function
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-676: Use of Potentially Dangerous Function'
    - 'CWE-1325: Improperly Controlled Sequential Memory Allocation'
    owasp:
    - A06:2025 - Insecure Design
    references:
    - https://nullprogram.com/blog/2019/10/28/
    - https://docs.microsoft.com/en-us/cpp/sanitizers/asan-error-examples
  message: Use of alloca() is unsafe because it cannot ensure that the pointer  returned
    points to a valid and usable block of memory. The allocation  made may exceed
    the bounds of the stack, or even go further into other  objects in memory, and
    alloca() cannot determine such an error.
  severity: ERROR
  languages:
  - c
  - cpp
  pattern: alloca(...)
- id: 0xdea.c.insecure-api-ato.raptor-insecure-api-ato
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - audit
    vulnerability_class: Dangerous Method or Function
    likelihood: LOW
    impact: MEDIUM
    confidence: HIGH
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-839: Numeric Range Comparison Without Minimum Check'
    owasp:
    - A10:2025 - Mishandling of Exceptional Conditions
    references:
    - https://rules.sonarsource.com/c/type/Bug/RSPEC-989
    - https://wiki.sei.cmu.edu/confluence/display/c/ERR34-C.+Detect+errors+when+converting+a+string+to+a+number
    - https://github.com/vixie/cron/commit/9cc8ab1087bb9ab861dd5595c41200683c9f6712
  message: The atoi(), atol(), atof(), and similar functions don't handle errors.
    They don't check for integer overflow and can return a negative value.  They have
    undefined behavior if the value of the result cannot be  represented. They return
    0 (or 0.0) if the string does not represent  an integer (or decimal), which is
    indistinguishable from a correctly  formatted, zero-denoting input string.
  severity: INFO
  languages:
  - c
  - cpp
  pattern-either:
  - pattern: atoi(...)
  - pattern: atol(...)
  - pattern: atof(...)
  - pattern: atoll(...)
- id: 0xdea.c.insecure-api-gets.raptor-insecure-api-gets
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - vuln
    vulnerability_class: Dangerous Method or Function
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    technology:
    - c
    - cpp
    cwe:
    - 'CWE-242: Use of Inherently Dangerous Function'
    - 'CWE-120: Buffer Copy without Checking Size of Input (''Classic Buffer Overflow'')'
    owasp:
    - A10:2025 - Mishandling of Exceptional Conditions
    references:
    - https://g.co/kgs/PCHQjJ
  message: The gets() function is always unsafe because it does not perform bounds  checking
    on the size of its input. An attacker can easily send  arbitrarily-sized input
    to gets() and overflow the destination buffer.
  severity: ERROR
  languages:
  - c
  - cpp
  pattern: gets(...)
- id: 0xdea.c.insecure-api-mktemp-tmpnam-tempnam.raptor-insecure-api-mktemp-tmpnam-tempnam
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    subcategory:
    - audit
    vulnerability_class: Dangerous Method or Function
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
    technology:
    - c
    - cpp
    cwe:

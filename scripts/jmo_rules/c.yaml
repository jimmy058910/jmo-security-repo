    - https://docs.oracle.com/cd/E37838_01/html/E61050/gnclc.html
  message: Locate all calls to interesting and potentially insecure API functions
    (candidate points). The auditor can backtrace from these candidate points to find
    pathways allowing access from untrusted input.
  severity: WARNING
  languages:
  - c
  - cpp
  pattern-either:
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*set\w*(u|g)id\s*$|^\w*(init|set)groups\s*$|^\w*Impersonate\w*\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*str\w?(cpy|add)(_s)?(_l)?\s*$|^\w*stpn?cpy(_s)?(_l)?\s*$|^\w*(wc|mb|ftc|tc)s\w?cpy(_s)?(_l)?\s*$|^\w*wcpn?cpy(_s)?(_l)?\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*str\w?cat(_s)?(_l)?\s*$|^\w*(wc|mb|ftc|tc)s\w?cat(_s)?(_l)?\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*strtok(_r)?(_s)?(_l)?\s*$|^\w*(wc|mb)stok(_r)?(_s)?(_l)?\s*$|^\w*str(find|rspn|trns)\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*s\w*printf(_s)?(_l)?\w*\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*scanf(_s)?(_l)?\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*get(s|ws(_l)?|ts|tws|c|char|pw|pass|wd|cwd|login(_r)?|groups|hostname|domainname|opt|opt_long)\s*$|^\w*cuserid\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*(get|set|put|unset)env\s*$|^\w*g_get_(home|tmp)_dir\s*$
  - patterns:
    - pattern: $FUN($_, $_, $LEN, ...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*mem(c|p)?cpy(_s)?\s*$|^\w*memmove(_s)?\s*$|^\w*bcopy\s*$|^\w*CopyMemory\s*$
    - pattern-not: $FUN($_, $_, sizeof(...), ...)

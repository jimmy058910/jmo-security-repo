- id: solidity.security.accessible-selfdestruct.accessible-selfdestruct
  severity: ERROR
  languages:
  - solidity
  message: Contract can be destructed by anyone in $FUNC
  metadata:
    category: security
    technology:
    - solidity
    cwe: 'CWE-284: Improper Access Control'
    confidence: LOW
    likelihood: HIGH
    impact: HIGH
    subcategory:
    - vuln
    references:

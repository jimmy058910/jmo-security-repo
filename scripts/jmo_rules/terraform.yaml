          language: json
          patterns:
          - pattern-not-inside: '{..., "Effect": "Deny", ...}

              '
          - pattern-either:
            - pattern: '{..., "Principal": "*", ...}

                '
            - pattern: '{..., "Principal": [..., "*", ...], ...}

                '
            - pattern: '{..., "Principal": { "AWS": "*" }, ...}


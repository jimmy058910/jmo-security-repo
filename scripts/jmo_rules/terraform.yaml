      \ {\n    ...\n  }\n  ...\n}\n"
  - pattern-not-inside: "resource \"aws_cloudfront_distribution\" $ANYTHING {\n  ...\n\
      \  viewer_certificate {\n    ...\n    minimum_protocol_version = \"TLSv1.2_2018\"\
      \n    ...\n  }\n  ...\n}\n"

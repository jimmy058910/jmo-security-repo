        \ ...\n"
    - pattern: "volumes:\n  - ...\n  - /run/docker.sock:/var/run/docker.sock\n  -\
        \ ...\n"
    - pattern: "volumes:\n  - ...\n  - /var/run/docker.sock\n  - ...\n"
    - pattern: "volumes:\n  - ...\n  - /run/docker.sock\n  - ...\n"
    - pattern: "volumes:\n  - ...\n  - ...\n    source: /var/run/docker.sock\n   \

- id: lgpl-cc.yaml.spring.accesscontrol.rule-SpringActuatorFullyEnabled.yaml_spring_rule-SpringActuatorFullyEnabled
  languages:
  - yaml
  severity: WARNING
  message: "Spring Boot Actuator is fully enabled. This exposes sensitive endpoints\n\
    such as /actuator/env, /actuator/logfile, /actuator/heapdump and others.\nIf the\
    \ application lacks proper security measures (e.g., authentication and \nauthorization),\
    \ sensitive data could be accessed, compromising the application and \nits infrastructure.\
    \ This configuration poses a serious risk in production \nenvironments or public-facing\
    \ deployments.\n\nTo mitigate the risks, take the following measures:\n  - Expose\
    \ only the Actuator endpoints required for your use case\n  - For production environments,\
    \ restrict exposure to non-sensitive endpoints \n  like `health` or `info`\n \
    \ - Ensure Actuator endpoints are protected with authentication and authorization\
    \ \n  (e.g., via Spring Security)\n  - Use environment-specific configurations\
    \ to limit exposure in production\n\nSecure Code Example:\nInstead of include:\
    \ \"*\", list only the endpoints you need to expose:\n```\nmanagement:\n  endpoints:\n\
    \    web:\n      exposure:\n        include: \"health,info,metrics\"\n```\n\n\
    References:\n- https://docs.spring.io/spring-boot/reference/actuator/endpoints.html#actuator.endpoints.exposing\n\
    - https://medium.com/walmartglobaltech/perils-of-spring-boot-actuators-misconfiguration-185c43a0f785\n\
    - https://blog.maass.xyz/spring-actuator-security-part-1-stealing-secrets-using-spring-actuators\n"
  metadata:
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    shortDescription: Exposure of sensitive system information to an unauthorized
      control sphere
    category: security
    cwe: CWE-497
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A01:2021-Broken Access Control
    - A01:2025-Broken Access Control
    security-severity: Medium
    technology:
    - java
  patterns:
  - pattern: "management:\n  ...\n  endpoints:\n    ...\n    web:\n      ...\n   \
      \   exposure:\n        ...\n        include: \"*\"\n        ...\n"
- id: yaml.argo.security.argo-workflow-parameter-command-injection.argo-workflow-parameter-command-injection
  message: Using input or workflow parameters in here-scripts can lead to command
    injection or code injection. Convert the parameters to env variables instead.
  languages:
  - yaml
  metadata:
    category: security
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS
      Command Injection'')'
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 – Injection
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    references:
    - https://github.com/argoproj/argo-workflows/issues/5061
    - https://github.com/argoproj/argo-workflows/issues/5114#issue-808865370
    technology:
    - ci
    - argo
  severity: ERROR
  patterns:
  - pattern-inside: 'apiVersion: $VERSION

      ...

      '
  - metavariable-regex:
      metavariable: $VERSION
      regex: (argoproj.io.*)
  - pattern-either:
    - patterns:
      - pattern-inside: "command:\n  ...\n  - python\n  ...\n...\nsource: \n  $SCRIPT\n"
      - focus-metavariable: $SCRIPT
      - metavariable-pattern:
          metavariable: $SCRIPT
          language: python
          patterns:
          - pattern: '$FUNC(..., $PARAM, ...)

              '
          - metavariable-pattern:
              metavariable: $PARAM
              pattern-either:
              - pattern-regex: (.*{{.*inputs.parameters.*}}.*)
              - pattern-regex: (.*{{.*workflow.parameters.*}}.*)
    - patterns:
      - pattern-inside: "command:\n  ...\n  - $LANG\n  ...\n...\nsource: \n  $SCRIPT\n"
      - metavariable-regex:
          metavariable: $LANG
          regex: (bash|sh)
      - focus-metavariable: $SCRIPT
      - metavariable-pattern:
          metavariable: $SCRIPT
          language: bash
          patterns:
          - pattern: '$CMD ... $PARAM  ...

              '
          - metavariable-pattern:
              metavariable: $PARAM
              pattern-either:
              - pattern-regex: (.*{{.*inputs.parameters.*}}.*)
              - pattern-regex: (.*{{.*workflow.parameters.*}}.*)
    - patterns:
      - pattern-inside: "container:\n  ...\n  command: $LANG\n  ...\n  args: $PARAM\n"
      - metavariable-regex:
          metavariable: $LANG
          regex: .*(sh|bash|ksh|csh|tcsh|zsh).*
      - metavariable-pattern:
          metavariable: $PARAM
          pattern-either:
          - pattern-regex: (.*{{.*inputs.parameters.*}}.*)
          - pattern-regex: (.*{{.*workflow.parameters.*}}.*)
      - focus-metavariable: $PARAM

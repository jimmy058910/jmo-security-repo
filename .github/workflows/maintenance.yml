---
name: Repository Maintenance

# Consolidated maintenance workflows
# Merged from: repo-completeness-check.yml, weekly-tool-update.yml, version-check.yml
#
# Schedule:
#   - 00:00 UTC Sunday: Weekly tool updates (auto-update-tools)
#   - 02:00 UTC Sunday: Version consistency checks (check-versions + related)
#   - 06:00 UTC Monday: Weekly repository analysis (repo-completeness)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Sunday 00:00 UTC - tool updates
    - cron: '0 2 * * 0'  # Sunday 02:00 UTC - version checks
    - cron: '0 6 * * 1'  # Monday 06:00 UTC - repo completeness
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: false
        default: 'all'
        type: choice
        options: [all, tool-update, version-check, completeness]
      create_issues:
        description: 'Create GitHub issues for outdated tools (version-check task only)'
        required: false
        default: 'true'
        type: boolean
      bump_level:
        description: 'Bump level for auto-update-tools (cumulative: minor includes patch; major includes patch+minor)'
        required: false
        default: 'minor'
        type: choice
        options: [patch, minor, major, all]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ─── Tool Update ──────────────────────────────────────────────────────────────
  # Runs: Sunday 00:00 UTC (schedule) OR manual dispatch with task=tool-update/all
  auto-update-tools:
    name: Auto-update all security tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * 0') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'tool-update' || github.event.inputs.task == 'all'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        # Only for `uv lock` in the relock step below. Nothing here installs the
        # project, so there is no uv cache worth saving (and Python is already
        # set up above).
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.15"  # pinned: single uv version across all sites (PR #488)
          enable-cache: false

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml requests packaging pre-commit

      - name: Check for tool updates
        id: check
        run: |
          echo "Checking for available tool updates..."
          python3 scripts/dev/update_versions.py --check-latest > check_output.txt || true
          cat check_output.txt

          # Check if any updates are available
          if grep -q "UPDATE AVAILABLE" check_output.txt; then
            echo "updates_available=true" >> "$GITHUB_OUTPUT"
            echo "Updates available"
          else
            echo "updates_available=false" >> "$GITHUB_OUTPUT"
            echo "All tools already up-to-date"
          fi

      - name: Verify Actions can create PRs
        # Fail-fast guardrail: the repo-level setting "Allow GitHub Actions to
        # create and approve pull requests" (Settings → Actions → Workflow
        # permissions) gates `gh pr create` from GITHUB_TOKEN independently of
        # the workflow `permissions:` block. When OFF, the workflow burns
        # ~3 min on tool bumps + commit before failing at the PR step — and
        # leaves an orphan branch behind (cleaned up by the failure-handler
        # step, but visible enough to confuse triage). Catch it in step ~5.
        #
        # Defensive: the GitHub Actions API endpoint nominally requires
        # `administration: read` which GITHUB_TOKEN doesn't grant by default.
        # If the API call fails (insufficient scope), warn and proceed —
        # `gh pr create`'s own error message is the next layer of defense.
        # The label-create step (PR #396) and orphan-branch cleanup step
        # already exist for the latent-failure path; this is purely a UX
        # improvement on the first 5 seconds of the job.
        #
        # Background: run 26347764859 (2026-05-23) hit this — setting was OFF
        # so PR creation failed at step 12. Re-enabling at the UI fixed it.
        if: steps.check.outputs.updates_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if perms=$(gh api "repos/$REPO/actions/permissions/workflow" \
              --jq '.can_approve_pull_request_reviews' 2>/dev/null); then
            if [ "$perms" != "true" ]; then
              echo "::error::GitHub Actions is not permitted to create PRs in this repo."
              echo "::error::Enable at: Settings -> Actions -> General -> Workflow permissions"
              echo "::error::Check: 'Allow GitHub Actions to create and approve pull requests'"
              exit 1
            fi
            echo "PR-creation permission verified ($perms)."
          else
            echo "::warning::Could not query Actions permission setting (token may lack admin:read scope)."
            echo "::warning::Proceeding — 'gh pr create' will surface the real error if blocked."
          fi

      - name: Capture classification manifest (before update)
        # MUST run before --update-all, otherwise the manifest sees
        # current==latest for every bumped tool and reports level=patch
        # for all. The PR body reads this file so reviewers see the
        # actual bump level of each change.
        if: steps.check.outputs.updates_available == 'true'
        run: |
          python3 scripts/dev/update_versions.py --classify > classify_before.json
          echo "Classification captured:"
          cat classify_before.json

      - name: Resolve bump level
        id: level
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BUMP_LEVEL: ${{ github.event.inputs.bump_level }}
        run: |
          # Default to 'minor' on cron — auto-PR patches+minors only, leave
          # majors/unknowns for the tracking-issue dashboard. Dispatch overrides.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_BUMP_LEVEL" ]; then
            LEVEL="$DISPATCH_BUMP_LEVEL"
          else
            LEVEL="minor"
          fi
          echo "bump_level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "Using bump level: $LEVEL"

      - name: Update tools to latest versions (filtered by bump level)
        if: steps.check.outputs.updates_available == 'true'
        env:
          BUMP_LEVEL: ${{ steps.level.outputs.bump_level }}
        run: |
          echo "Updating tools at bump level: $BUMP_LEVEL"
          python3 scripts/dev/update_versions.py --update-all --level="$BUMP_LEVEL"

          echo ""
          echo "Syncing changes to the Dockerfile..."
          python3 scripts/dev/update_versions.py --sync

      - name: Update pre-commit hooks
        run: |
          echo "Updating pre-commit hook versions..."
          pre-commit autoupdate

          # Apply any formatting changes from updated hooks
          pre-commit run --all-files || true

      - name: Relock the tools pre-commit and uv.lock both pin
        # The pin-pair guard (tests/unit/test_toolchain_version_agreement.py)
        # fails when a pre-commit hook and uv.lock pin different versions of the
        # same tool. `pre-commit autoupdate` just moved the hook revs, so move the
        # lock to the same versions in the same PR. The tool list is that guard's:
        # every hook whose id is also a package in uv.lock (ruff, mypy, bandit).
        # Exact `==` pins, so nothing else in the lock moves. `revs[tool]` raises
        # if a hook is renamed, failing the step loudly.
        #
        # Only tools whose rev differs from the lock are relocked, and `uv lock`
        # is skipped when none does: `uv lock --upgrade-package` re-resolves and
        # rewrites the file even for an unchanged version, and this job's uv
        # (0.11.15) writes `revision = 3` over the committed `revision = 5`.
        # Without the skip every quiet week would carry a one-line lock diff and
        # open a PR.
        run: |
          pins=$(python3 - <<'PY'
          import re
          import tomllib

          import yaml

          TOOLS = ("ruff", "mypy", "bandit")
          with open(".pre-commit-config.yaml", encoding="utf-8") as fh:
              config = yaml.safe_load(fh)
          revs = {}
          for repo in config["repos"]:
              if repo["repo"] == "local":
                  continue
              for hook in repo.get("hooks", []):
                  revs[hook["id"]] = re.sub(r"^v", "", str(repo["rev"]))
          with open("uv.lock", "rb") as fh:
              locked = {p["name"]: p["version"] for p in tomllib.load(fh)["package"]}
          for tool in TOOLS:
              if locked[tool] != revs[tool]:
                  print(f"{tool}=={revs[tool]}")
          PY
          )
          if [ -z "$pins" ]; then
            echo "uv.lock already matches the hook revs; nothing to relock."
            exit 0
          fi
          echo "Relocking: $pins"

          args=()
          for pin in $pins; do
            args+=(--upgrade-package "$pin")
          done
          uv lock "${args[@]}"

      - name: Commit changes
        id: commit
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create branch for updates
          BRANCH="auto-update-deps-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"

          # Stage changes
          git add versions.yaml Dockerfile .pre-commit-config.yaml uv.lock
          # Stage any files reformatted by updated hooks
          git add -u -- scripts/ tests/ hooks/

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Create commit message
          cat > commit_message.txt << 'COMMIT_MSG'
          chore(deps): weekly auto-update of security tools and pre-commit hooks

          Automated weekly update of security tools and pre-commit hooks.
          uv.lock moves ruff, mypy and bandit to their new hook revs.
          COMMIT_MSG

          # Commit changes
          git commit -F commit_message.txt

          # Push branch
          git push origin "$BRANCH"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Close superseded tool-update PRs
        # Each week's PR replaces the last. Without this a stale branch of older
        # bumps stays open next to the new one and the routine has two PRs to
        # judge. The branch pushed in this run is skipped, as are fork PRs.
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          stale=$(gh pr list --state open --limit 100 \
            --json number,headRefName,isCrossRepository \
            --jq '.[]
              | select(.isCrossRepository | not)
              | select(.headRefName | startswith("auto-update-deps-"))
              | [.number, .headRefName] | @tsv')

          while IFS=$'\t' read -r number head; do
            [ -n "$number" ] || continue
            [ "$head" != "$BRANCH" ] || continue
            echo "Closing #$number ($head): superseded by $BRANCH"
            gh pr close "$number" \
              --comment "Superseded by this week's tool update." \
              --delete-branch
          done <<< "$stale"

      - name: Create Pull Request
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          BUMP_LEVEL: ${{ steps.level.outputs.bump_level }}
        run: |
          # Compose PR body with the pre-update classification manifest
          # embedded. Reviewers see the exact bumps and their levels without
          # having to diff versions.yaml by hand. The `classify_before.json`
          # file is the one captured before --update-all ran.
          {
            echo "## Weekly Tool & Pre-commit Updates"
            echo ""
            echo "Bump level applied: \`$BUMP_LEVEL\` (cumulative — includes all lower levels)."
            echo ""
            echo "### What's Updated"
            echo ""
            echo "- **Security tools**: \`update_versions.py --update-all --level=$BUMP_LEVEL\`, Dockerfile synced"
            echo "- **Pre-commit hooks**: \`pre-commit autoupdate\`, formatting applied"
            echo "- **uv.lock**: ruff, mypy and bandit relocked to their new hook revs"
            echo "  (\`uv lock --upgrade-package\`), so the two pins agree"
            echo ""
            echo "### Merge Policy"
            echo ""
            echo "Targets \`dev\`. Nothing in GitHub Actions merges this PR, and a PR opened"
            echo "with \`GITHUB_TOKEN\` gets no CI run of its own. The weekly maintenance"
            echo "routine runs CI against it and merges it only when that run is green."
            echo ""
            echo "Any older open \`auto-update-deps-*\` PR was closed as superseded."
            echo ""
            if [ -f classify_before.json ]; then
              echo "<details><summary>Bumps in this PR (from \`--classify\`)</summary>"
              echo ""
              echo '```json'
              cat classify_before.json
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            fi
            echo "---"
            echo ""
            echo "**Automated PR** — Generated by maintenance workflow (tool-update task)"
            echo "**Schedule**: Every Sunday at 00:00 UTC"
            echo "**Workflow**: \`.github/workflows/maintenance.yml\`"
          } > pr_body.txt

          gh pr create \
            --title "chore(deps): weekly auto-update $(date +%Y-%m-%d) (level=$BUMP_LEVEL)" \
            --body-file pr_body.txt \
            --base dev \
            --head "$BRANCH" \
            --label "dependencies" \
            --label "automated"

          # NOTE: auto-merge is intentionally NOT enabled here. The weekly
          # maintenance routine owns the merge, after a CI run it dispatched
          # is green — see docs/RELEASE.md.

      - name: Clean up branch if PR creation failed
        # Transactional cleanup: if `git push origin "$BRANCH"` succeeded but
        # `gh pr create` failed downstream, the branch is orphaned remotely
        # with no PR pointing at it. Run 25615768624 (2026-05-10) hit this:
        # branch `auto-update-deps-20260510` got pushed but PR creation failed,
        # leaving stranded state until manual cleanup. Delete the orphan so
        # next week's run starts from a clean slate.
        if: failure() && steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          if [ -n "$BRANCH" ]; then
            echo "PR creation failed — deleting orphan branch '$BRANCH'"
            git push origin --delete "$BRANCH" || \
              echo "::warning::Could not delete branch '$BRANCH' — manual cleanup may be needed"
          fi

      - name: Summary
        if: always()
        env:
          HAS_CHANGES: ${{ steps.commit.outputs.has_changes }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          BUMP_LEVEL: ${{ steps.level.outputs.bump_level }}
          UPDATES_AVAILABLE: ${{ steps.check.outputs.updates_available }}
        run: |
          {
            echo "## Weekly Tool Update Summary"
            echo ""
            echo "Bump level: \`${BUMP_LEVEL:-minor}\` (cumulative)"
            echo ""

            if [ "$HAS_CHANGES" = "true" ]; then
              echo "**Pull request opened**"
              echo ""
              echo "- Branch: \`$BRANCH\`"
              echo "- Labels: \`dependencies\`, \`automated\`"
              echo "- Base: \`dev\`; merged by the weekly maintenance routine after its CI run is green"
              echo ""
              if [ "$UPDATES_AVAILABLE" = "true" ]; then
                echo "- Security tools: updated at level \`${BUMP_LEVEL:-minor}\`"
              else
                echo "- Security tools: already up-to-date"
              fi
              echo "- Pre-commit hooks: checked for updates"
            else
              echo "**Nothing to merge**"
              echo ""
              echo "Either all tools are already up-to-date, or all outstanding bumps"
              echo "fall outside the \`${BUMP_LEVEL:-minor}\` level filter"
              echo "(major/unknown bumps live in the tracking issue)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Version Checks ───────────────────────────────────────────────────────────
  # Runs: Sunday 02:00 UTC (schedule) OR manual dispatch with task=version-check/all
  # Depends on auto-update-tools when both run together (manual dispatch with task=all)
  check-versions:
    name: Check tool versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      always() && (
        (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 0') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'version-check' || github.event.inputs.task == 'all'))
      )
    needs:
      - auto-update-tools
    # always() ensures this job runs even when auto-update-tools is skipped
    # (e.g., on the Sunday 02:00 schedule when only version checks are triggered)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # `packaging` is required by update_versions.py for semver bump
          # classification (--check-latest fails fast with 'packaging not
          # installed' otherwise). Match auto-update-tools job above.
          pip install pyyaml packaging

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Check for latest versions
        id: check
        run: |
          set -euo pipefail
          if ! python3 scripts/dev/update_versions.py --check-latest > version_check_output.txt 2>&1; then
            cat version_check_output.txt
            echo "::error::update_versions.py --check-latest failed"
            exit 1
          fi
          cat version_check_output.txt
          if grep -q "UPDATE AVAILABLE" version_check_output.txt; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate version report
        run: |
          python3 scripts/dev/update_versions.py --report

      - name: Check outdated tools and create issues
        if: github.event_name == 'schedule' || github.event.inputs.create_issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/dev/update_versions.py --check-outdated --create-issues

      - name: Validate version consistency across files
        run: |
          # Check Dockerfile versions match versions.yaml
          python3 scripts/dev/update_versions.py --sync --dry-run || {
            echo "::error::The Dockerfile is out of sync with versions.yaml"
            echo "::error::Run: python3 scripts/dev/update_versions.py --sync"
            exit 1
          }

  check-dockerfile-consistency:
    name: Validate Dockerfile consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 0') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'version-check' || github.event.inputs.task == 'all'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for hardcoded versions in the Dockerfile
        run: |
          # This check ensures versions are parameterized via ARG/ENV variables
          # and not hardcoded inline
          echo "Checking Dockerfile for hardcoded versions..."

          # Look for download URLs with hardcoded versions (bad pattern)
          if grep -P 'github.com/[^/]+/[^/]+/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/' Dockerfile | grep -v "\${.*_VERSION}"; then
            echo "::warning file=Dockerfile::Found hardcoded version in download URL"
            echo "::notice::Found potential hardcoded versions. Review manually."
          else
            echo "No hardcoded versions detected"
          fi

  check-python-deps:
    name: Check Python dependency freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 0') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'version-check' || github.event.inputs.task == 'all'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check PyPI for security tool updates
        run: |
          # Check if Python security tools have updates
          for tool in semgrep checkov ruff; do
            echo "Checking $tool..."
            CURRENT=$(grep -oP "${tool}==[0-9.]+" Dockerfile | head -n1 | cut -d'=' -f3 || echo "unknown")
            LATEST=$(pip index versions "$tool" 2>/dev/null | grep -oP '(?<=Available versions: )[0-9.]+' | head -n1 || echo "unknown")

            echo "  Current: $CURRENT"
            echo "  Latest:  $LATEST"

            if [ "$CURRENT" != "$LATEST" ] && [ "$CURRENT" != "unknown" ] && [ "$LATEST" != "unknown" ]; then
              echo "::notice::$tool has update available: $CURRENT -> $LATEST"
            fi
          done

  # Summary job - fails if any critical version check issues found
  version-check-summary:
    name: Version check summary
    runs-on: ubuntu-latest
    needs: [check-versions, check-dockerfile-consistency, check-python-deps]
    if: >
      always() && (
        (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 0') ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'version-check' || github.event.inputs.task == 'all'))
      )
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.check-versions.result }}" == "failure" ]; then
            echo "::error::Version check failed - see check-versions job"
            exit 1
          fi

          if [ "${{ needs.check-dockerfile-consistency.result }}" == "failure" ]; then
            echo "::error::Dockerfile consistency check failed"
            exit 1
          fi

          if [ "${{ needs.check-python-deps.result }}" == "failure" ]; then
            echo "::error::Python dependency check failed"
            exit 1
          fi

          echo "All version checks passed"

  # ─── Repository Completeness ─────────────────────────────────────────────────
  # Runs: Monday 06:00 UTC (schedule) OR push/PR OR manual dispatch with task=completeness/all
  repo-completeness:
    name: Repository Completeness Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'completeness' || github.event.inputs.task == 'all'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.15"  # pinned: single uv version across all sites (PR #488)
          python-version: '3.12'  # preserves the pin actions/setup-python held
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Put the project venv on PATH
        shell: bash
        # Windows needs a WINDOWS-style path here. Git Bash resolves POSIX entries
        # like /d/a/repo/.venv/Scripts itself, so `python -m pytest` runs fine --
        # but the Python process inherits the raw PATH string, and shutil.which()
        # on Windows cannot interpret a POSIX path. Every external tool lookup
        # (semgrep, checkov, trivy...) then silently returns None. cygpath -w fixes
        # it; the POSIX branch only ever runs on Linux/macOS.
        run: |
          if [ -d .venv/Scripts ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Run repository completeness analysis
        run: |
          python3 scripts/dev/analyze_repo_completeness.py

      - name: Upload analysis report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repo-completeness-analysis-${{ github.run_id }}
          path: dev-only/REPO_COMPLETENESS_ANALYSIS.json
          retention-days: 30

      - name: Check for critical issues
        id: check
        run: |
          CRITICAL_COUNT=$(jq '.summary.critical_issues' dev-only/REPO_COMPLETENESS_ANALYSIS.json)
          TOTAL_COUNT=$(jq '.summary.total_issues' dev-only/REPO_COMPLETENESS_ANALYSIS.json)

          echo "critical=$CRITICAL_COUNT" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "Found $CRITICAL_COUNT critical issues (total: $TOTAL_COUNT)"
            echo "Review: dev-only/REPO_COMPLETENESS_ANALYSIS.json"
            # Warning only - change to exit 1 when issues resolved
            exit 0
          fi

          echo "No critical issues found (total: $TOTAL_COUNT)"

      - name: Post summary to PR
        # Skip on fork PRs: GitHub grants fork-PR runs a read-only GITHUB_TOKEN,
        # so issue-comment creation fails with HttpError 403 ("Resource not
        # accessible by integration") and reds-X the whole job for every
        # external contribution. Internal-branch PRs still get the comment; the
        # full analysis is always available via the uploaded artifact above.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('dev-only/REPO_COMPLETENESS_ANALYSIS.json', 'utf8'));

            const criticalCount = report.summary.critical_issues;
            const totalCount = report.summary.total_issues;

            const statusEmoji = criticalCount === 0 ? 'PASS' : 'WARNING';
            const statusIcon = criticalCount === 0 ? ':white_check_mark:' : ':warning:';

            const summary = `
            ## ${statusIcon} Repository Completeness Analysis: ${statusEmoji}

            **Total Issues:** ${totalCount}
            **Critical Issues:** ${criticalCount}

            ### Breakdown
            - Undocumented features: ${report.findings.undocumented_features.length}
            - Doc-code drift: ${report.findings.doc_code_drift.length}
            - Test gaps: ${report.findings.test_gaps.length}
            - Inconsistencies: ${report.findings.inconsistencies.length}

            ### Top Recommendations
            ${report.findings.recommendations.slice(0, 5).map(r => `- **[${r.priority}]** ${r.action} (${r.count} items)`).join('\n')}

            <details>
            <summary>View Full Report</summary>

            #### Undocumented Features (${report.findings.undocumented_features.length})
            ${report.findings.undocumented_features
              .slice(0, 10)
              .map(f => `- \`${f.file}:${f.line}\` - ${f.name} (${f.severity})`)
              .join('\n')}
            ${report.findings.undocumented_features.length > 10
              ? `\n_...and ${report.findings.undocumented_features.length - 10} more_`
              : ''}

            #### Doc-Code Drift (${report.findings.doc_code_drift.length})
            ${report.findings.doc_code_drift.map(d => `- ${d.issue} (${d.severity})`).join('\n')}

            #### Test Gaps (${report.findings.test_gaps.length})
            ${report.findings.test_gaps.slice(0, 10).map(t => `- \`${t.file}\``).join('\n')}
            ${report.findings.test_gaps.length > 10 ? `\n_...and ${report.findings.test_gaps.length - 10} more_` : ''}

            </details>

            ---

            **Full Analysis:**
            [Download artifact](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            **Action Plan:**
            [UNIFICATION_ACTION_PLAN.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/dev-only/UNIFICATION_ACTION_PLAN.md)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

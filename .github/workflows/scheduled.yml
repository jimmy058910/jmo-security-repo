  nightly-notify-failure:
    name: Notify on Nightly Failure
    runs-on: ubuntu-latest
    needs:
      - nightly-extended-tests
      - nightly-cross-platform
      - nightly-security-regression
      - nightly-docker-smoke
      - tool-smoke-tests
      - lint-full
      - integration-tests
    if: failure()
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = `Nightly test suite failed on ${today}`;

            const body = `## Nightly Test Failure

            The nightly test suite failed. Please investigate and fix.

            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            **Troubleshooting:**
            1. Check workflow logs for specific failures
            2. Run tests locally: \`pytest tests/ -v\`
            3. Check for flaky tests or environmental issues
            4. Review recent commits for potential breaking changes
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-test-failure',
              sort: 'created',
              direction: 'desc'
            });

            // Dedupe on the LABEL, not on a title carrying today's date (#966).
            // A dated title can only ever match a re-run within the same UTC
            // day, so the comment branch below could not fire across nights and
            // one outage filed one issue per night: 14 open issues on
            // 2026-08-22 all reported the identical `verified=163` failure.
            // listForRepo also returns pull requests, which are never the
            // tripwire's own issue.
            const existingIssue = issues.data.find(issue => !issue.pull_request);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'ci', 'nightly-test-failure']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Nightly tests failed again on ${today}.\n\n` +
                  `Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              });
            }

# ==============================================================================
# E2E COMPREHENSIVE TESTS - Full integration tests
# Runs weekdays at 4AM UTC or on manual dispatch
# ==============================================================================
  e2e-ubuntu:
    name: E2E Ubuntu Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    # Run on 4AM weekday schedule OR manual e2e/all selection
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1-5' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'e2e' || github.event.inputs.task == 'all')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.15"  # pinned: single uv version across all sites (PR #488)
          python-version: '3.12'  # preserves the pin actions/setup-python held
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install JMo Security
        run: uv sync --locked --group dev

      - name: Put the project venv on PATH
        shell: bash
        # Windows needs a WINDOWS-style path here. Git Bash resolves POSIX entries
        # like /d/a/repo/.venv/Scripts itself, so `python -m pytest` runs fine --
        # but the Python process inherits the raw PATH string, and shutil.which()
        # on Windows cannot interpret a POSIX path. Every external tool lookup
        # (bandit, semgrep, trivy...) then silently returns None. cygpath -w fixes
        # it; the POSIX branch only ever runs on Linux/macOS.
        run: |
          if [ -d .venv/Scripts ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Probe the jmo CLI
        # uv sync installs the project, so `jmo` resolves from the venv now.
        run: jmo --help || echo "jmo CLI not available"

      - name: Install external security tools
        run: |
          make tools || echo "Some tools failed to install, continuing..."

      - name: Pre-pull BuildKit image (best-effort retry; mitigates Docker Hub timeouts)
        continue-on-error: true
        run: |
          # setup-buildx-action bootstraps a docker-container driver by pulling
          # moby/buildkit from Docker Hub, which intermittently times out on the
          # anonymous token/manifest endpoints and reds the nightly. Pre-pull with
          # retries so the bootstrap finds the image locally. continue-on-error
          # keeps this strictly best-effort: a total failure falls back to the
          # original setup-buildx behaviour (no worse than today).
          for attempt in 1 2 3; do
            docker pull moby/buildkit:buildx-stable-1 && break
            echo "::warning::buildkit image pull attempt $attempt failed; retrying in 15s"
            sleep 15
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Pull Docker test images
        run: |
          docker pull alpine:3.19
          docker pull nginx:alpine
          docker pull redis:alpine

      - name: Run comprehensive test suite
        id: run_tests
        run: |
          echo "Running full Ubuntu + Advanced test suite"
          RESULTS_DIR="/tmp/jmo-e2e-results-${{ github.run_id }}"
          mkdir -p "$RESULTS_DIR"
          python -m pytest tests/e2e/ -v --timeout=300 \
            --ignore=tests/e2e/test_linux_specific.py \
            --ignore=tests/e2e/test_macos_specific.py \
            --ignore=tests/e2e/test_windows_specific.py \
            -m "not docker" \
            --json-report \
            --json-report-file="$RESULTS_DIR/pytest-report.json" \
            2>&1 | tee "$RESULTS_DIR/test.log"
        env:
          TEST_REPO: https://github.com/juice-shop/juice-shop.git
          TEST_IMAGE: alpine:3.19
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ubuntu-results-${{ github.run_id }}
          path: |
            /tmp/jmo-e2e-results-${{ github.run_id }}/pytest-report.json
            /tmp/jmo-e2e-results-${{ github.run_id }}/test.log
          retention-days: 30

      - name: Check test success
        if: always()
        run: |
          RESULTS_DIR="/tmp/jmo-e2e-results-${{ github.run_id }}"
          if [[ -f "$RESULTS_DIR/pytest-report.json" ]]; then
            REPORT="$RESULTS_DIR/pytest-report.json"
            FAILED_TESTS=$(python3 -c "import json; r=json.load(open('$REPORT')); print(r['summary'].get('failed',0))")
            if [[ $FAILED_TESTS -gt 0 ]]; then
              echo "$FAILED_TESTS tests failed"
              exit 1
            else
              echo "All tests passed"
            fi
          else
            echo "No test results found"
            exit 1
          fi

  e2e-macos:
    name: E2E macOS Tests
    runs-on: macos-14
    timeout-minutes: 120
    # Run on 4AM weekday schedule OR manual e2e/all selection
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1-5' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'e2e' || github.event.inputs.task == 'all')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.15"  # pinned: single uv version across all sites (PR #488)
          python-version: '3.12'  # preserves the pin actions/setup-python held
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install JMo Security
        run: uv sync --locked --group dev

      - name: Put the project venv on PATH
        shell: bash
        # Windows needs a WINDOWS-style path here. Git Bash resolves POSIX entries
        # like /d/a/repo/.venv/Scripts itself, so `python -m pytest` runs fine --
        # but the Python process inherits the raw PATH string, and shutil.which()
        # on Windows cannot interpret a POSIX path. Every external tool lookup
        # (bandit, semgrep, trivy...) then silently returns None. cygpath -w fixes
        # it; the POSIX branch only ever runs on Linux/macOS.
        run: |
          if [ -d .venv/Scripts ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Install external security tools
        run: |
          set -euo pipefail

          # checkov is pinned from versions.yaml AT RUNTIME, not copied into
          # this file. Two separate defects made run 31241312938 report a
          # green tick over a scanner that found nothing (#769):
          #
          #   1. Homebrew installs whatever bottle is current. It gave this job
          #      checkov 3.3.0 against a versions.yaml pin of 3.3.8, and 3.3.0
          #      returned zero findings on a deliberately vulnerable fixture.
          #      A hardcoded pin here would only move the drift -- that is #747
          #      (ci.yml said trufflehog 3.94.3, versions.yaml said 3.95.9).
          #      Reading the source of truth leaves nowhere to forget.
          #   2. `|| echo "Some tools failed"` made a scanner that never
          #      installed indistinguishable from one that found nothing.
          CHECKOV_VERSION="$(python3 -c \
            "import yaml; print(yaml.safe_load(open('versions.yaml'))['python_tools']['checkov']['version'])")"
          echo "checkov pin from versions.yaml: ${CHECKOV_VERSION}"
          uv pip install "checkov==${CHECKOV_VERSION}"

          # Binary tools have no per-version Homebrew formulae, so they stay
          # unpinned -- but the install may no longer fail quietly. Pinning
          # these too is a real remaining gap, tracked separately.
          brew install semgrep trivy syft hadolint

          missing=0
          for t in checkov semgrep trivy syft hadolint; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "  $t -> $(command -v "$t")"
            else
              echo "::error::$t did not install"
              missing=1
            fi
          done
          [[ "${missing}" -eq 0 ]] || exit 1

          checkov --version

      - name: Run macOS test suite
        run: |
          RESULTS_DIR="/tmp/jmo-e2e-results-${{ github.run_id }}"
          mkdir -p "$RESULTS_DIR"
          python -m pytest tests/e2e/ -v --timeout=300 \
            --ignore=tests/e2e/test_linux_specific.py \
            --ignore=tests/e2e/test_windows_specific.py \
            -m "not docker" \
            --json-report \
            --json-report-file="$RESULTS_DIR/pytest-report.json" \
            2>&1 | tee "$RESULTS_DIR/test.log"
        env:
          TEST_REPO: https://github.com/juice-shop/juice-shop.git
          TEST_IMAGE: alpine:3.19
          RESULTS_BASE: /tmp/jmo-e2e-results-${{ github.run_id }}
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-macos-results-${{ github.run_id }}
          path: |
            /tmp/jmo-e2e-results-${{ github.run_id }}/pytest-report.json
            /tmp/jmo-e2e-results-${{ github.run_id }}/test.log
          retention-days: 30


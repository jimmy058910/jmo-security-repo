    needs: [e2e-ubuntu, e2e-macos, e2e-tool-integration, tool-contract-tests, e2e-visual]
    if: |
      always() && (
        github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1-5' ||
        github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'e2e' || github.event.inputs.task == 'all')
      )
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-*-results-*
          path: test-results

      - name: Aggregate results
        run: |
          {
            echo "## E2E Test Summary"
            echo ""
          } > summary.md

          get_field() {
            python3 -c \
              "import json,sys; r=json.load(open(sys.argv[1])); \
               print(r.get('summary',{}).get(sys.argv[2],0))" \
              "$1" "$2" 2>/dev/null || echo 0
          }

          reports=0
          total_failed=0
          seen=""

          for report_file in test-results/*/pytest-report.json; do
            if [[ -f "$report_file" ]]; then
              reports=$((reports + 1))
              job=$(dirname "$report_file" | xargs basename \
                | sed 's/-results-.*//' | sed 's/e2e-//')
              seen="${seen} ${job}"

              total=$(get_field "$report_file" total)
              passed=$(get_field "$report_file" passed)
              failed=$(get_field "$report_file" failed)
              skipped=$(get_field "$report_file" skipped)
              total_failed=$((total_failed + failed))

              {
                echo "### $job Results"
                echo "- Total: $total"
                echo "- Passed: $passed"
                echo "- Failed: $failed"
                echo "- Skipped: $skipped"
                echo ""
              } >> summary.md
            fi
          done

          cat summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

          # Grouped rather than three separate redirects: shellcheck's SC2129,
          # which actionlint surfaces. It only fires where shellcheck is on
          # PATH, so it is invisible locally and red in the nightly's
          # `--all-files` lint. Same idiom as the `> summary.md` block above.
          {
            echo "E2E_REPORTS=$reports"
            echo "E2E_TOTAL_FAILED=$total_failed"
            echo "E2E_SEEN_SUITES=${seen}"
          } >> "$GITHUB_ENV"

      - name: Upload summary
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-summary-${{ github.run_id }}
          path: summary.md
          retention-days: 90

      # e2e-ubuntu and e2e-macos run their pytest step under
      # `continue-on-error: true` so that results and logs still upload when
      # tests fail. The side effect was that a failing suite rendered as a
      # green check: run 31241312938 had `2 failed` and an explicit
      # "E2E Release Readiness: FAIL (89.5%)" in the macOS log while every job,
      # and the run, reported success.
      #
      # Those two are also the only jobs that upload a pytest-report.json, so
      # two reports -- not five -- is the expected count here. The other three
      # e2e jobs (tool-integration, contract, visual) have no
      # continue-on-error, so a failure in one of them already fails the run on
      # its own and needs no gate.
      #
      # This step is the gate. It runs after the artifacts are safely uploaded,
      # reads the same pytest-report.json files the summary above already
      # parses, and is the only thing here allowed to fail the run.
      #
      # Absent evidence fails too: zero reports means the suites did not run,
      # which must not be indistinguishable from a clean pass. That is the same
      # mistake in a different costume.
      #
      # TODO(issue-772): partial absence is not caught yet -- one report when
      # two are expected still passes. Tightening that needs a count that
      # survives adding a sixth e2e job; see the issue for the options.
      - name: Fail the run if any e2e test failed
        env:
          # The suites that upload a pytest-report.json -- which is exactly the
          # set whose pytest step runs under `continue-on-error: true`, so
          # their failures cannot fail their own job and need this gate. The
          # other three e2e jobs (tool-integration, contract, visual) have no
          # continue-on-error and fail the run natively.
          #
          # Add a job to that set and you must add it here, or its failures go
          # unwatched exactly as #769's did.
          EXPECTED_E2E_SUITES: "ubuntu macos"
        run: |
          echo "reports found: ${E2E_REPORTS} | tests failed: ${E2E_TOTAL_FAILED}"
          echo "suites reporting:${E2E_SEEN_SUITES:- <none>}"

          if [[ "${E2E_REPORTS}" -eq 0 ]]; then
            echo "::error::No pytest-report.json was produced by any e2e job." \
              "The suites did not run, so this is a failure, not a pass."
            exit 1
          fi

          # Partial absence is absent evidence too (#772). Until this check,
          # one report where two were expected printed "All 1 e2e suite(s)
          # reported zero failures" and exited 0 -- #769's mistake in a smaller
          # costume, inferring health from the absence of bad news. The guard
          # above only caught the all-or-nothing case.
          read -ra expected_suites <<< "${EXPECTED_E2E_SUITES}"
          missing=""
          for suite in "${expected_suites[@]}"; do
            case " ${E2E_SEEN_SUITES} " in
              *" ${suite} "*) ;;
              *) missing="${missing} ${suite}" ;;
            esac
          done
          if [[ -n "${missing// /}" ]]; then
            echo "::error::No pytest-report.json from:${missing}." \
              "Those suites produced no evidence, which is a failure, not a pass."
            exit 1
          fi

          if [[ "${E2E_TOTAL_FAILED}" -gt 0 ]]; then
            echo "::error::${E2E_TOTAL_FAILED} e2e test(s) failed." \
              "See the job summary above for the per-suite breakdown."
            exit 1
          fi

          echo "All ${E2E_REPORTS} e2e suite(s) reported zero failures:" \
            "${E2E_SEEN_SUITES# }."

# ==============================================================================
# PERFORMANCE TESTS - Benchmark comparison
# Only runs on manual dispatch (PR benchmarks handled in ci.yml)
# ==============================================================================
  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only manual trigger (PR-based performance testing handled in ci.yml)
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'performance' || github.event.inputs.task == 'all')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.15"  # pinned: single uv version across all sites (PR #488)
          python-version: '3.12'  # preserves the pin actions/setup-python held
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Put the project venv on PATH
        shell: bash
        # Windows needs a WINDOWS-style path here. Git Bash resolves POSIX entries
        # like /d/a/repo/.venv/Scripts itself, so `python -m pytest` runs fine --
        # but the Python process inherits the raw PATH string, and shutil.which()
        # on Windows cannot interpret a POSIX path. Every external tool lookup
        # (bandit, semgrep, trivy...) then silently returns None. cygpath -w fixes
        # it; the POSIX branch only ever runs on Linux/macOS.
        run: |
          if [ -d .venv/Scripts ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Run baseline benchmarks (main branch)
        id: perf-tests
        continue-on-error: true
        run: |
          git checkout main
          python3 -m pytest tests/performance/test_benchmarks.py \
            -v \
            --benchmark-only \
            --benchmark-json=baseline-results.json

      - name: Warn on performance regression
        if: steps.perf-tests.outcome == 'failure'
        run: |
          echo "::warning::Performance benchmarks failed. Review nightly logs for regressions."

      - name: Checkout current branch
        run: |
          git checkout ${{ github.sha }}

      - name: Run current benchmarks
        id: current
        run: |
          python3 -m pytest tests/performance/test_benchmarks.py \
            -v \
            -m benchmark \
            --tb=short \
            --benchmark-json=current-results.json

      - name: Compare results and detect regressions
        id: compare
        run: |
          python3 scripts/dev/compare_benchmarks.py \
            --baseline baseline-results.json \
            --current current-results.json \
            --threshold 20 \
            --output benchmark-comparison.md
        continue-on-error: true

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            baseline-results.json
            current-results.json
            benchmark-comparison.md
          retention-days: 30

      - name: Fail on performance regression
        if: steps.compare.outputs.regression_detected == 'true'
        run: |
          echo "Performance regression detected! See benchmark-comparison.md for details."
          exit 1

# ==============================================================================
# DOCKER VALIDATION - Validates JMo Security Docker image variants
# Runs weekly Sunday at 3AM UTC or on manual dispatch (task=docker or task=all)
# ==============================================================================
  validate-variants:
    name: Validate ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # expected_tools is the number of tools ACTUALLY in the Docker image
          # (on amd64). For fast/slim/balanced, that equals PROFILE_TOOLS in
          # scripts/core/tool_registry.py. For deep, subtract the 4 tools in
          # MANUAL_INSTALL_TOOLS (akto, afl++, mobsf, falco) which are listed
          # in PROFILE_TOOLS["deep"] but intentionally not in the image —
          # users install them manually (see docs/MANUAL_INSTALLATION.md).
          # Counts post-v1.0.3 (bearer removed from PROFILE_TOOLS in PR #339):
          #   deep:     28 profile - 4 manual = 24 in image
          #   balanced: 17 in profile (no manual tools)
          #   slim:     13 in profile (no manual tools)
          #   fast:      9 (unchanged)
          # Then #795 added shellcheck to deep (it was in the other three and
          # not the most comprehensive one); Dockerfile.deep already built and
          # verified the binary, so only the profile count moves:
          #   deep:     29 profile - 4 manual = 25 in image
          - variant: deep
            expected_tools: 25   # 29 profile - 4 manual-only = 25
            profile: deep
          - variant: balanced
            expected_tools: 17
            profile: balanced
          - variant: slim
            expected_tools: 13
            profile: slim
          - variant: fast
            expected_tools: 9
            profile: fast
    # Run on Sunday 3AM schedule OR manual docker/all dispatch
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'docker' || github.event.inputs.task == 'all')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }}

      - name: Verify tool installation
        id: tools
        env:
          # Route matrix values through env vars so shellcheck can statically
          # analyze the script (actionlint replaces ${{ }} with opaque
          # placeholders before invoking shellcheck, which triggers SC2170 on
          # `-lt <placeholder>` regardless of quoting — prior PR #300's unquote
          # hack never took effect for this reason).
          # Also hardens against CWE-78 shell injection per release.rules.md.
          VARIANT: ${{ matrix.variant }}
          PROFILE: ${{ matrix.profile }}
          EXPECTED_TOOLS: ${{ matrix.expected_tools }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }}
        run: |
          echo "Checking tools in $VARIANT variant..."
          # --profile is required: without it, `tools check --json` emits a dict of
          # profile summaries where `installed` is an integer count, not a per-tool
          # boolean — the jq filter below would then match zero entries (jq is
          # strictly typed: `7 == true` is false).
          # Capture stderr separately so a silent-exit bug (zero stdout, non-zero rc)
          # emits a diagnosable error to the job log instead of just "exit code 1".
          # Capture the exit code WITHOUT `if !`. Bash's `!` replaces $? with the
          # NEGATED status, so `if ! cmd; then rc=$?` yields 0 for every failure,
          # and the `exit "$rc"` below then exited 0 -- the step passed and the
          # count assertion never ran. Not hypothetical: run 31925247675
          # (2026-08-16) logged `tools check --profile deep exited with rc=0` and
          # reported SUCCESS, while balanced/slim/fast each printed their real
          # count. `Validate deep` had never verified anything. Measured chunk 21.
          # `set -e` is on (Actions runs `bash -e`), which is why the original
          # needed `if !` at all; `set +e` around the call is the fix that keeps
          # both the guard and the true exit code.
          set +e
          docker run --rm "$IMAGE_REF" \
              tools check --profile "$PROFILE" --json \
              > tools-check.json 2>tools-check.stderr.log
          rc=$?
          set -e

          # Unparseable output is catastrophic regardless of rc.
          if ! jq -e 'type == "object" and length > 0' tools-check.json > /dev/null 2>&1; then
            echo "::error::tools check --profile $PROFILE produced no parseable JSON (rc=$rc)"
            echo "--- stderr ---"
            cat tools-check.stderr.log
            echo "--- stdout (tools-check.json) ---"
            cat tools-check.json
            exit "${rc:-1}"
          fi

          # rc alone cannot judge this image. `tools check` documents rc=1 as "some
          # tool is unavailable for ANY reason" -- including the MANUAL_INSTALL_TOOLS
          # (akto, afl++, mobsf, falco) deliberately not baked into the deep image.
          # So a correct deep image and a broken one both return 1. The CLI ships the
          # discriminator for exactly this case: `manual_install` per tool
          # (CHANGELOG v1.0.5, docs/CLI_REFERENCE.md:455). Judge on that, not on rc.
          NON_MANUAL_MISSING=$(jq -r \
            '[.[] | select(.installed == false and .manual_install != true)] | length' \
            tools-check.json)
          if [ "$rc" -ne 0 ] && [ "$NON_MANUAL_MISSING" -gt 0 ]; then
            echo "::error::tools check --profile $PROFILE exited rc=$rc with $NON_MANUAL_MISSING non-manual tool(s) missing"
            jq -r 'to_entries[]
                   | select(.value.installed == false and .value.manual_install != true)
                   | "  missing: \(.key)"' tools-check.json
            echo "--- stderr ---"
            cat tools-check.stderr.log
            exit "$rc"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "rc=$rc, and every missing tool is manual_install -- expected for $VARIANT."
          fi

          # Count installed tools (expected JSON shape: {tool_name: {installed: bool, ...}})
          INSTALLED=$(jq '[.[] | select(.installed == true)] | length' tools-check.json)
          PROFILE_SIZE=$(jq 'length' tools-check.json)
          echo "installed_count=$INSTALLED" >> "$GITHUB_OUTPUT"

          echo "Installed tools: $INSTALLED of $PROFILE_SIZE in the image's own profile (checkout expects ~$EXPECTED_TOOLS)"

          # `$EXPECTED_TOOLS` is NOT the pass condition. It cannot be: it is
          # computed from the checkout's PROFILE_TOOLS, while the image ships
          # whatever the last `v*` tag built, and the two are different programs.
          # Measured (#1039): PROFILE_TOOLS["deep"] holds 28 entries at v1.0.8
          # and 29 on main -- `shellcheck` joined the profile after the tag -- so
          # a perfectly good deep image reports 28 - 4 manual = 24 against an
          # expectation of 25 and fails for no defect at all.
          #
          # The real pass condition is NON_MANUAL_MISSING above, which is
          # derived from the image's own output and names the offender. This
          # stays only as a META-GUARD: it catches an image whose profile
          # collapsed or whose output shape changed, where "0 non-manual
          # missing" would otherwise be vacuously true. One tool of slack
          # absorbs exactly the release skew described above.
          if [ "$PROFILE_SIZE" -lt "$((EXPECTED_TOOLS - 1))" ]; then
            echo "::error::the image's own $PROFILE profile lists only $PROFILE_SIZE tools; the checkout expects around $EXPECTED_TOOLS."
            echo "A shortfall of more than one is image drift, not release skew."
            jq -r 'to_entries[] | select(.value.installed == false) | "  installed=false: \(.key)"' tools-check.json
            exit 1
          fi

      - name: Test scan capability
        run: |
          # Create sample vulnerable code
          mkdir -p /tmp/test-repo/src
          cat > /tmp/test-repo/src/app.js << 'EOF'
          const userId = req.query.id;
          const query = "SELECT * FROM users WHERE id = " + userId;
          EOF
          # UID mismatch fix: GitHub runner is UID 1001, container USER jmo
          # is UID 1000. Bind mounts preserve host UID, so without this chmod
          # the container can't write /scan/results (PermissionError [Errno 13]).
          # Safe because the mount source is a run-scoped tmp directory.
          chmod 777 /tmp/test-repo

      - name: Run scan
        id: docker-scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v /tmp/test-repo:/scan \
            -w /scan \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }} \
            scan --repo . --profile ${{ matrix.profile }} --results-dir /scan/results

      - name: Verify scan results
        run: |
          if [ "${{ steps.docker-scan.outcome }}" == "failure" ]; then
            echo "::error::Docker scan for ${{ matrix.variant }} failed"
            exit 1
          fi
          if [ ! -d /tmp/test-repo/results ]; then
            echo "::error::Scan completed but produced no results directory"
            exit 1
          fi
          echo "Scan completed successfully"
          ls -la /tmp/test-repo/results

      - name: Test help command
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }} --help

      - name: Test version command
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }} --version

      - name: Upload tools check results
        uses: actions/upload-artifact@v7
        with:
          name: tools-check-${{ matrix.variant }}
          path: tools-check.json
          retention-days: 30

  # ==============================================================================
  # DOCKER E2E SUITE — the other half of #962
  # ==============================================================================
  # tests/e2e/test_docker_workflows.py holds 60 tests that, before #962, were run
  # by NO automation at all: every marker filter in ci.yml and scheduled.yml
  # carries `not docker`, and nothing invoked them by path either.
  # validate-variants above is the closest thing that existed, and it runs
  # `docker run <image> tools check` directly -- it never invokes pytest.
  #
  # This job runs the FULL four-variant set against the PUBLISHED images, which
  # is the artifact users actually pull. ci.yml's docker-smoke is the PR-time
  # half: it is path-gated and builds only the fast variant, because between
  # release tags the published images do not change, so running the whole suite
  # per-PR would re-measure a constant.
  #
  # Sunday, beside validate-variants, which already pulls all four images -- so
  # the marginal cost is the test time, not the pull.
  #
  # Measured 2026-08-25 against published v1.0.8, all four variants:
  # 56 passed, 4 skipped, 0 failed in 14m49s. The 4 skips are the darwin/win32
  # entries in the cross-platform matrix, correctly skipped on Linux.
  docker-e2e-suite:
    name: Docker E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'docker' || github.event.inputs.task == 'all')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.15"  # pinned: single uv version across all sites (PR #488)
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Put the project venv on PATH
        shell: bash
        run: |
          if [ -d .venv/Scripts ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Run the full Docker e2e suite
        # JMO_DOCKER_REGISTRY is deliberately unset: the default is the published
        # GHCR repo, and auditing what users pull is the point of this job. Set it
        # only to test a locally built image, as ci.yml's docker-smoke does.
        #
        # -rs so skips print their reason. Four are expected (darwin/win32
        # entries in the cross-platform matrix); anything beyond that means a
        # prerequisite went missing, and a skip must not be mistaken for a pass.
        run: pytest tests/e2e/test_docker_workflows.py -m docker -q -rs --timeout=1800

  # ==============================================================================
  # DOCKER VALIDATION SUMMARY
  # Reports overall Docker variant validation status
  # ==============================================================================
  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: validate-variants
    if: |
      always() && (
        github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0' ||
        github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'docker' || github.event.inputs.task == 'all')
      )
    steps:
      - name: Check validation results
        run: |
          if [ "${{ needs.validate-variants.result }}" == "failure" ]; then
            echo "::error::One or more Docker variants failed validation"
            exit 1
          fi
          echo "All Docker variants validated successfully"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tools-check-*
          path: artifacts

      - name: Generate summary
        run: |
          {
            echo "# Docker Validation Summary"
            echo ""
            echo "| Variant | Status | Tools |"
            echo "|---------|--------|-------|"

            for variant in deep balanced slim fast; do
              if [ -f "artifacts/tools-check-$variant/tools-check.json" ]; then
                TOOLS=$(jq '[.[] | select(.installed == true)] | length' "artifacts/tools-check-$variant/tools-check.json")
                echo "| $variant | :white_check_mark: | $TOOLS |"
              else
                echo "| $variant | :x: | N/A |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ==============================================================================
  # WEEKLY BACKLOG SUMMARY
  # Runs Monday 1PM UTC (after weekend Dependabot batch settles).
  # Posts a visibility-only snapshot of Issues / PRs / Dependabot alerts to
  # the workflow run's Step Summary. No actions taken; the human triages
  # via the relevant skill (jmo-issue-triage / jmo-dependabot-triage /
  # jmo-tool-update-triage). Solo-dev longevity bias: visibility, not bots.
  # ==============================================================================
  backlog-summary:
    name: Weekly Backlog Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'backlog' || github.event.inputs.task == 'all'))
    permissions:
      contents: read
      issues: read
      pull-requests: read
      security-events: read
    steps:
      - name: Collect backlog metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Open Dependabot security alerts (requires security_events scope)
          ALERTS_OPEN=$(gh api "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
            --jq 'length' 2>/dev/null || echo "0")
          ALERTS_CRIT=$(gh api "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
            --jq '[.[] | select(.security_advisory.severity == "critical")] | length' 2>/dev/null || echo "0")
          ALERTS_HIGH=$(gh api "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
            --jq '[.[] | select(.security_advisory.severity == "high")] | length' 2>/dev/null || echo "0")

          # Open PRs by author class
          PRS_TOTAL=$(gh pr list --repo "$REPO" --state open --json number --jq 'length')
          PRS_DEPENDABOT=$(gh pr list --repo "$REPO" --state open --search "author:app/dependabot" --json number --jq 'length')
          PRS_HUMAN=$((PRS_TOTAL - PRS_DEPENDABOT))

          # Open issues by category
          ISSUES_TOTAL=$(gh issue list --repo "$REPO" --state open --limit 200 --json number --jq 'length')
          ISSUES_TOOL_UPDATE=$(gh issue list --repo "$REPO" --state open --limit 200 \
            --search "author:app/github-actions" --json number --jq 'length')
          ISSUES_BUG=$(gh issue list --repo "$REPO" --state open --label bug --limit 200 --json number --jq 'length')
          ISSUES_ENH=$(gh issue list --repo "$REPO" --state open --label enhancement --limit 200 --json number --jq 'length')
          ISSUES_TECHDEBT=$(gh issue list --repo "$REPO" --state open --label technical-debt --limit 200 --json number --jq 'length')
          ISSUES_GFI=$(gh issue list --repo "$REPO" --state open --label "good first issue" --limit 200 --json number --jq 'length')

          # Stale PR detection (open >14 days)
          PRS_STALE=$(gh pr list --repo "$REPO" --state open --json number,createdAt \
            --jq "[.[] | select(((now - (.createdAt | fromdate)) / 86400) > 14)] | length")

          {
            echo "# :clipboard: Weekly Backlog Summary"
            echo ""
            echo "Generated $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "## :shield: Security"
            echo ""
            echo "| Metric | Count | Triage Skill |"
            echo "|--------|-------|--------------|"
            echo "| Dependabot alerts (open, total) | **$ALERTS_OPEN** | \`/jmo-dependabot-triage\` |"
            echo "| Dependabot alerts (critical) | $ALERTS_CRIT | \`/jmo-dependabot-triage\` |"
            echo "| Dependabot alerts (high) | $ALERTS_HIGH | \`/jmo-dependabot-triage\` |"
            echo ""
            echo "## :twisted_rightwards_arrows: Pull Requests"
            echo ""
            echo "| Metric | Count | Notes |"
            echo "|--------|-------|-------|"
            echo "| Open PRs (total) | **$PRS_TOTAL** | |"
            echo "| Open PRs (Dependabot) | $PRS_DEPENDABOT | \`/jmo-dependabot-triage\` |"
            echo "| Open PRs (human authors) | $PRS_HUMAN | Manual review |"
            echo "| Stale PRs (>14 days open) | $PRS_STALE | Investigate / close |"
            echo ""
            echo "## :memo: Issues"
            echo ""
            echo "| Metric | Count | Triage Skill |"
            echo "|--------|-------|--------------|"
            echo "| Open issues (total) | **$ISSUES_TOTAL** | |"
            echo "| Tool-update issues (\`app/github-actions\`) | $ISSUES_TOOL_UPDATE | \`/jmo-tool-update-triage\` |"
            echo "| \`bug\` | $ISSUES_BUG | \`/jmo-issue-triage\` |"
            echo "| \`enhancement\` | $ISSUES_ENH | \`/jmo-issue-triage\` |"
            echo "| \`technical-debt\` | $ISSUES_TECHDEBT | \`/jmo-issue-triage\` |"
            echo "| \`good first issue\` | $ISSUES_GFI | Curate more if <5 |"
            echo ""
            echo "---"
            echo ""
            echo "_This is a visibility-only snapshot. No automated actions taken — invoke the relevant triage skill for hands-on review._"
          } >> "$GITHUB_STEP_SUMMARY"

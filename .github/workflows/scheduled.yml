---
name: Scheduled Tests

# Consolidated scheduled test workflows
# Merged from: nightly-tests.yml, e2e-comprehensive-tests.yml, performance-regression.yml,
#              docker-validation.yml
#
# Schedule:
#   - 2AM UTC daily: Nightly extended tests
#   - 4AM UTC weekdays: E2E comprehensive tests
#   - 3AM UTC Sunday: Docker variant validation
#   - 1PM UTC Monday: Weekly backlog summary (after weekend Dependabot batch)
#
# Manual dispatch allows running any test suite on demand

on:
  schedule:
    - cron: '0 2 * * *'    # 2AM UTC daily - nightly tests
    - cron: '0 4 * * 1-5'  # 4AM UTC Mon-Fri - E2E tests
    - cron: '0 3 * * 0'    # 3AM UTC Sunday - Docker validation
    - cron: '0 13 * * 1'   # 1PM UTC Monday - weekly backlog visibility
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: Manual test execution requires task selection for targeted testing
    inputs:
      task:
        description: 'Which test suite to run'
        type: choice
        options:
          - nightly
          - e2e
          - performance
          - docker
          - backlog
          - all
        default: 'all'

permissions:
  contents: read
  issues: write
  packages: read
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jimmy058910/jmo-security

# ==============================================================================
# NIGHTLY TESTS - Extended test suite with security audits
# Runs daily at 2AM UTC or on manual dispatch
# ==============================================================================
jobs:
  nightly-extended-tests:
    name: Nightly Extended Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Run on 2AM schedule OR manual nightly/all selection
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 2 * * *' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'nightly' || github.event.inputs.task == 'all')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.15"  # pinned: single uv version across all sites (PR #488)
          python-version: '3.12'  # preserves the pin actions/setup-python held
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Put the project venv on PATH
        shell: bash
        # Windows needs a WINDOWS-style path here. Git Bash resolves POSIX entries
        # like /d/a/repo/.venv/Scripts itself, so `python -m pytest` runs fine --
        # but the Python process inherits the raw PATH string, and shutil.which()
        # on Windows cannot interpret a POSIX path. Every external tool lookup
        # (bandit, semgrep, trivy...) then silently returns None. cygpath -w fixes
        # it; the POSIX branch only ever runs on Linux/macOS.
        run: |
          if [ -d .venv/Scripts ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Install security tools
        env:
          TRUFFLEHOG_VERSION: "3.97.1"  # Pin per versions.yaml — see release.rules.md
        run: |
          v="$TRUFFLEHOG_VERSION"  # short alias to keep URL line under 140 chars
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${v}/trufflehog_${v}_linux_amd64.tar.gz" \
            -o /tmp/trufflehog.tar.gz
          gzip -t /tmp/trufflehog.tar.gz
          tar -xzf /tmp/trufflehog.tar.gz -C /usr/local/bin trufflehog
          chmod +x /usr/local/bin/trufflehog
          pip install bandit

      - name: Run full test suite (including slow tests)
        run: |
          # Exclude `requires_tools` (need real scanners installed on the runner;
          # exercised by `e2e-tool-integration` job) and `smoke` tests (need
          # `jmo` installed via PyPI; exercised by smoke tests against the
          # released package). This Nightly Extended Tests job runs everything
          # else (slow + non-tool-dependent + non-smoke) for comprehensive
          # coverage. Convention matches ci.yml's exclusion set.
          pytest tests/ \
            --cov=scripts \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-report=xml \
            --json-report \
            --json-report-file=pytest-report.json \
            -v \
            --durations=20 \
            --maxfail=20 \
            -m "not requires_tools and not smoke"

      - name: Summarize pytest failures
        if: always()
        shell: bash
        # Bumped --maxfail from 5 to 20 in 2026-04 to break the bug-archeology
        # cycle (post-v1.0.3 stabilization needed 5 successive PRs to drill past
        # truncation). This step renders the full failure list to the run's
        # Summary tab so future archeology cycles see all failures at once.
        # See .claude/rules/testing.rules.md "Bug Archeology" for context.
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report_path = Path("pytest-report.json")
          if not report_path.exists():
              print("# Nightly Extended Tests — Summary unavailable")
              print()
              print("`pytest-report.json` was not produced (pytest may have crashed).")
              raise SystemExit

          data = json.loads(report_path.read_text())
          summary = data.get("summary", {})
          tests = data.get("tests", [])
          failed = [t for t in tests if t.get("outcome") == "failed"]
          errors = [t for t in tests if t.get("outcome") == "error"]

          total = summary.get("total", len(tests))
          n_pass = summary.get("passed", 0)
          n_fail = summary.get("failed", len(failed))
          n_error = summary.get("error", len(errors))
          duration = data.get("duration", 0)

          print("# Nightly Extended Tests — Run Summary")
          print()
          print(
              f"**{total} collected, {n_pass} passed, {n_fail} failed, "
              f"{n_error} errors, {duration:.0f}s.**"
          )
          print()

          combined = failed + errors
          if not combined:
              print(":white_check_mark: All tests passed.")
              raise SystemExit

          # Cap per-failure output to keep the Summary tab under GHA's ~1MB cap.
          MAX_LISTED = 50
          listed = combined[:MAX_LISTED]
          for t in listed:
              nodeid = t.get("nodeid", "?")
              outcome = t.get("outcome", "?")
              call = t.get("call") or {}
              msg = (call.get("longrepr") or t.get("longrepr") or "(no traceback captured)")
              if isinstance(msg, dict):
                  msg = msg.get("reprcrash", {}).get("message", str(msg))
              msg_str = str(msg)[:2000]
              print(f"## `{nodeid}` ({outcome})")
              print()
              print("```")
              print(msg_str)
              print("```")
              print()

          if len(combined) > MAX_LISTED:
              hidden = len(combined) - MAX_LISTED
              print(f"_… {hidden} more failure(s) truncated. See pytest-report.json artifact for the full list._")
          PY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: nightly
          name: nightly-coverage

      - name: Run performance benchmarks
        # This used to end in `|| echo "Performance tests completed with
        # warnings"`, so the step exited 0 whatever pytest returned -- and it is
        # the ONLY job that runs tests/performance/ as a directory (the
        # performance-benchmarks job below targets test_benchmarks.py alone).
        # The memory gate in test_stress.py was therefore insulated twice: it
        # skipped for a missing psutil, AND a tripped assertion could not have
        # failed this job. Both removed under #977; see that test's docstring.
        run: |
          pytest tests/performance/ -v --tb=short

      - name: Run security audit
        run: |
          echo "Running security audit..."
          bandit -r scripts/ -c pyproject.toml

          echo ""
          echo "Scanning for secrets..."
          set -euo pipefail
          # Same `if ! cmd; then rc=$?` defect as validate-variants below: bash's
          # `!` replaces $? with the negated status, so EXIT_CODE was always 0 and
          # `exit 0` reported SUCCESS on a crashed scanner -- and terminated the
          # step before the verified-secrets check ran. A fail-open on a secret
          # scan. Found by sweeping for the pattern in chunk 21; fixed here rather
          # than filed because it is the same two lines in the same file.
          set +e
          trufflehog filesystem . --json --exclude-paths .trufflehog-exclude.txt \
              --only-verified > trufflehog-results.json 2>trufflehog-stderr.txt
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::TruffleHog exited with code ${EXIT_CODE}"
            cat trufflehog-stderr.txt >&2
            exit "${EXIT_CODE}"
          fi

          if [ ! -s trufflehog-results.json ]; then
            echo "Security audit complete. Verified secrets: 0"
          else
            VERIFIED=$({ jq -r 'select(.Verified == true)' trufflehog-results.json || true; } | wc -l)
            if [ "$VERIFIED" -gt 0 ]; then
              echo "::error::Found $VERIFIED verified secrets!"
              exit 1
            fi
            echo "Security audit complete. Verified secrets: $VERIFIED"
          fi

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results-${{ github.run_id }}
          path: |
            htmlcov/
            coverage.xml
            trufflehog-results.json
            pytest-report.json
          retention-days: 7

  nightly-cross-platform:
    name: Cross-Platform Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Run on 2AM schedule OR manual nightly/all selection
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 2 * * *' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'nightly' || github.event.inputs.task == 'all')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.15"  # pinned: single uv version across all sites (PR #488)
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Put the project venv on PATH
        shell: bash
        # Windows needs a WINDOWS-style path here. Git Bash resolves POSIX entries
        # like /d/a/repo/.venv/Scripts itself, so `python -m pytest` runs fine --
        # but the Python process inherits the raw PATH string, and shutil.which()
        # on Windows cannot interpret a POSIX path. Every external tool lookup
        # (bandit, semgrep, trivy...) then silently returns None. cygpath -w fixes
        # it; the POSIX branch only ever runs on Linux/macOS.
        run: |
          if [ -d .venv/Scripts ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Run unit tests
        shell: bash
        # Exclude `slow` to prevent perf-threshold flakes on slower GHA runners
        # (especially Windows, which is 2-3x slower for filesystem I/O than Linux).
        # Replaces tactical `@pytest.mark.skipif(sys.platform == "win32", ...)` decorators
        # added in PR #362 with the broader marker-filter pattern documented in
        # .claude/rules/testing.cross-platform.rules.md "Workflow Marker Filter Convention".
        run: |
          pytest tests/unit/ \
            --cov=scripts \
            --cov-report=term-missing \
            -v \
            --maxfail=20 \
            -m "not slow"

      - name: Run CLI tests
        shell: bash
        run: |
          pytest tests/cli/ -v --maxfail=20 -m "not slow"

  nightly-security-regression:
    name: Security Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run on 2AM schedule OR manual nightly/all selection
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 2 * * *' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'nightly' || github.event.inputs.task == 'all')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.15"  # pinned: single uv version across all sites (PR #488)
          python-version: '3.12'  # preserves the pin actions/setup-python held
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Put the project venv on PATH
        shell: bash
        # Windows needs a WINDOWS-style path here. Git Bash resolves POSIX entries
        # like /d/a/repo/.venv/Scripts itself, so `python -m pytest` runs fine --
        # but the Python process inherits the raw PATH string, and shutil.which()
        # on Windows cannot interpret a POSIX path. Every external tool lookup
        # (bandit, semgrep, trivy...) then silently returns None. cygpath -w fixes
        # it; the POSIX branch only ever runs on Linux/macOS.
        run: |
          if [ -d .venv/Scripts ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Run security regression test suite
        run: |
          pytest \
            tests/cli/test_path_sanitizers.py \
            tests/unit/test_archive_security.py \
            tests/unit/test_history_db_performance.py \
            -v --tb=short

      - name: Run path traversal fuzz tests
        run: |
          pytest tests/cli/test_path_sanitizers.py::TestPathTraversalFuzzing -v

  nightly-docker-smoke:
    name: Docker Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run on 2AM schedule OR manual nightly/all selection
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 2 * * *' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'nightly' || github.event.inputs.task == 'all')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pre-pull BuildKit image (best-effort retry; mitigates Docker Hub timeouts)
        continue-on-error: true
        run: |
          # setup-buildx-action bootstraps a docker-container driver by pulling
          # moby/buildkit from Docker Hub, which intermittently times out on the
          # anonymous token/manifest endpoints and reds the nightly. Pre-pull with
          # retries so the bootstrap finds the image locally. continue-on-error
          # keeps this strictly best-effort: a total failure falls back to the
          # original setup-buildx behaviour (no worse than today).
          for attempt in 1 2 3; do
            docker pull moby/buildkit:buildx-stable-1 && break
            echo "::warning::buildkit image pull attempt $attempt failed; retrying in 15s"
            sleep 15
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (balanced variant)
        run: |
          docker build -t jmo-security:nightly-test -f Dockerfile.balanced .

      - name: Test Docker image --help
        run: |
          docker run --rm jmo-security:nightly-test --help

      - name: Test Docker scan command
        run: |
          docker run --rm jmo-security:nightly-test scan --help

      - name: Scan test repository with Docker
        run: |
          mkdir -p test-repo results
          # Container runs as non-root USER jmo (UID 1000). The GitHub runner
          # creates these directories as the runner user (UID 1001), so jmo
          # cannot write to /results without a permission grant.
          chmod 777 test-repo results
          echo "print('test')" > test-repo/test.py
          docker run --rm \
            -v "$PWD/test-repo:/scan" \
            -v "$PWD/results:/results" \
            jmo-security:nightly-test scan \
              --repo /scan \
              --results-dir /results \
              --allow-missing-tools

  # Tool smoke tests: verify each tool completes within timeout and produces valid output
  # Catches hangs (like cdxgen 9+ min) and tool regressions before they affect users
  tool-smoke-tests:
    name: Tool Smoke Tests (Juice-Shop Fixture)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # Run on 2AM nightly schedule OR manual nightly/all dispatch
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 2 * * *' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'nightly' || github.event.inputs.task == 'all')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.15"  # pinned: single uv version across all sites (PR #488)
          python-version: '3.12'  # preserves the pin actions/setup-python held
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install JMo Security and test dependencies
        run: uv sync --locked --group dev

      - name: Put the project venv on PATH
        shell: bash
        # Windows needs a WINDOWS-style path here. Git Bash resolves POSIX entries
        # like /d/a/repo/.venv/Scripts itself, so `python -m pytest` runs fine --
        # but the Python process inherits the raw PATH string, and shutil.which()
        # on Windows cannot interpret a POSIX path. Every external tool lookup
        # (bandit, semgrep, trivy...) then silently returns None. cygpath -w fixes
        # it; the POSIX branch only ever runs on Linux/macOS.
        run: |
          if [ -d .venv/Scripts ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Install balanced profile tools
        env:
          # Pinned to versions.yaml. Update both files together when bumping.
          # Avoids upstream install.sh GitHub-API "latest" lookups that have
          # flaked in CI (see PR #350 + release.rules.md).
          TRIVY_VERSION: "0.74.0"
          GRYPE_VERSION: "0.118.0"
          SYFT_VERSION: "1.51.1"
          TRUFFLEHOG_VERSION: "3.97.1"
          HADOLINT_VERSION: "2.15.1"
        run: |
          # Install tools needed for smoke tests
          # Core SAST/SCA tools
          pip install semgrep checkov

          # Trivy - vulnerability scanner
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz
          gzip -t /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

          # Grype - SCA
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/grype.tar.gz
          gzip -t /tmp/grype.tar.gz
          tar -xzf /tmp/grype.tar.gz -C /usr/local/bin grype
          chmod +x /usr/local/bin/grype

          # Syft - SBOM
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/syft.tar.gz
          gzip -t /tmp/syft.tar.gz
          tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft

          # TruffleHog - secrets
          v="$TRUFFLEHOG_VERSION"  # short alias to keep URL line under 140 chars
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${v}/trufflehog_${v}_linux_amd64.tar.gz" \
            -o /tmp/trufflehog.tar.gz
          gzip -t /tmp/trufflehog.tar.gz
          tar -xzf /tmp/trufflehog.tar.gz -C /usr/local/bin trufflehog
          chmod +x /usr/local/bin/trufflehog

          # Hadolint - Dockerfile linter
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

          # ShellCheck - shell linter
          sudo apt-get update && sudo apt-get install -y shellcheck

          # cdxgen - SBOM generator (test for hangs)
          npm install -g @cyclonedx/cdxgen

          # Verify installations
          echo "Installed tools:"
          semgrep --version || echo "semgrep not available"
          trivy --version || echo "trivy not available"
          grype version || echo "grype not available"
          syft version || echo "syft not available"
          trufflehog --version || echo "trufflehog not available"
          hadolint --version || echo "hadolint not available"
          shellcheck --version || echo "shellcheck not available"
          cdxgen --version || echo "cdxgen not available"
          checkov --version || echo "checkov not available"

      - name: Run tool smoke tests
        run: |
          # Run smoke tests with timeout enforcement
          # Each tool has its own timeout, pytest-timeout is safety net
          pytest tests/integration/test_tool_smoke.py \
            -v \
            -m "smoke" \
            --tb=short \
            --timeout=300 \
            --maxfail=5
        env:
          CI: "true"

      - name: Upload smoke test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tool-smoke-results-${{ github.run_id }}
          path: |
            .pytest_cache/
            *.log
          retention-days: 7

  # Full pre-commit lint suite - nightly only (moved from ci.yml)
  lint-full:
    name: Lint (full pre-commit suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run on 2AM schedule OR manual nightly/all selection
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 2 * * *' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'nightly' || github.event.inputs.task == 'all')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.15"  # pinned: single uv version across all sites (PR #488)
          python-version: '3.12'  # preserves the pin actions/setup-python held
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --locked --group dev

      - name: Put the project venv on PATH
        shell: bash
        # Windows needs a WINDOWS-style path here. Git Bash resolves POSIX entries
        # like /d/a/repo/.venv/Scripts itself, so `python -m pytest` runs fine --
        # but the Python process inherits the raw PATH string, and shutil.which()
        # on Windows cannot interpret a POSIX path. Every external tool lookup
        # (bandit, semgrep, trivy...) then silently returns None. cygpath -w fixes
        # it; the POSIX branch only ever runs on Linux/macOS.
        run: |
          if [ -d .venv/Scripts ]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-precommit-

      - name: Run pre-commit (full suite, all hooks)
        env:
          # NOTE: Do NOT set PRE_COMMIT_HOME here. YAML's env: block passes the
          # value literally (no shell ~ expansion), so `PRE_COMMIT_HOME: ~/.cache/pre-commit`
          # would cause pre-commit to create a literal `./~/.cache/pre-commit/`
          # directory at the repo root. That then (a) defeats the cache action
          # at step ../Cache pre-commit environments (which uses `~/.cache/pre-commit`
          # expanded by Node), and (b) makes the `yamllint -c .yamllint.yaml .`
          # call below descend into third-party hook fixtures and fail. Letting
          # pre-commit default to $HOME/.cache/pre-commit matches the cache step.
          # Skip bandit (already covered by make lint)
          # Skip yamllint to avoid validating external pre-commit cache files
          # NOTE: uv-lock is deliberately NOT skipped. Its predecessor
          # (deps-compile) had to be, because Dependabot's pip resolver left
          # requirements-dev.txt in a non-canonical format after every bot merge,
          # so main could not satisfy the check. Dependabot now regenerates
          # uv.lock with uv, so the lock on main is canonical by construction and
          # the check must run here.
          SKIP: bandit,yamllint
        run: |
          pre-commit run --all-files --show-diff-on-failure
          # Run yamllint separately on our repo files only
          yamllint -c .yamllint.yaml .


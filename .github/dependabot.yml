# Dependabot configuration for JMo Security Suite
# Part of 5-layer version management system (ROADMAP.md #14, Issue #46)
# Handles: Python packages, Docker base images, GitHub Actions
#
# Schedule: Weekly on Monday at 04:00 UTC, every ecosystem. The weekly
#            maintenance routine starts Monday 04:00 America/Detroit (08:00 UTC
#            in daylight time, an hour later in standard time), so Dependabot
#            has opened its PRs before the routine looks for them.
# Cooldown:  `default-days: 7` on every ecosystem. A release is not proposed
#            until it is a week old, which lets a yanked or broken release be
#            pulled first. It covers version updates only; security updates are
#            exempt (checked against GitHub's options reference, 2026-10-22).
# Rationale: Prevents race conditions where Dependabot creates PRs before
#            critical commits (e.g., new modules) are merged to main branch

version: 2

updates:
  # Python dependencies (pyproject.toml [dependency-groups] + uv.lock).
  # The `uv` ecosystem regenerates uv.lock WITH uv, so bot output is canonical
  # by construction -- Dependabot and CI use the same resolver for the first
  # time. Under the old `pip` ecosystem, Dependabot rewrote the uv-generated
  # requirements-dev.txt with its own Linux-only pip resolver, which dropped
  # platform-conditional deps (pywin32 via mcp) and failed the next human PR's
  # freshness gate. See PRs #677, #682.
  - package-ecosystem: "uv"
    directory: "/"
    # Retargeted from the default branch (main) to dev for the v1.1.0
    # audit campaign: every bot PR against main widens a divergence the
    # release has to fast-forward across. Revert once v1.1.0 ships.
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "jimmy058910"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(python)"
      include: "scope"
    # ruff, mypy and bandit are also pinned as pre-commit hook revs, and
    # tests/unit/test_toolchain_version_agreement.py fails when the two pins
    # differ. A bump here moves only the lock side, so only the weekly
    # tool-update job (maintenance.yml), which moves both together, may touch
    # them (#1435). With `target-branch` set, GitHub does not apply this block
    # to security updates, which use the default branch.
    ignore:
      - dependency-name: "ruff"
      - dependency-name: "mypy"
      - dependency-name: "bandit"
    # Group by risk tier to collapse PR volume:
    # - python-minor-patch: non-breaking bumps (all deps, grouped weekly)
    # - python-major: one PR per major bump (stay un-grouped so we can review each)
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base image (Ubuntu)
  - package-ecosystem: "docker"
    directory: "/"
    # Retargeted from the default branch (main) to dev for the v1.1.0
    # audit campaign: every bot PR against main widens a divergence the
    # release has to fast-forward across. Revert once v1.1.0 ships.
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    reviewers:
      - "jimmy058910"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    # Retargeted from the default branch (main) to dev for the v1.1.0
    # audit campaign: every bot PR against main widens a divergence the
    # release has to fast-forward across. Revert once v1.1.0 ships.
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "jimmy058910"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    # Group the patch and minor action bumps into one weekly PR. GitHub Actions
    # tend to have stable APIs and bunch of tiny bumps — a single PR to review
    # is dramatically lighter than 5-8 separate ones. A major bump matches no
    # group, so it arrives as its own PR: a major can change inputs or
    # permissions, and that is the change to read alone.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm dependencies - scripts/dashboard
  - package-ecosystem: "npm"
    directory: "/scripts/dashboard"
    # Retargeted from the default branch (main) to dev for the v1.1.0
    # audit campaign: every bot PR against main widens a divergence the
    # release has to fast-forward across. Revert once v1.1.0 ships.
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dashboard-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # pre-commit hook revisions (.pre-commit-config.yaml)
  #
  # Ten pinned revs were updated only by hand. Nine of the ten measured current
  # when this was added, so it was never rot -- the hazard is sharper: ruff is
  # pinned in BOTH this file's hooks and uv.lock, and after #990 bumped the
  # lock they disagreed. The hook runs `ruff --fix`, so it REWROTE code at
  # 0.16.3 while `make lint` and CI CHECKED it at 0.16.4, and `ci.yml` skips the
  # ruff hook by design so CI could never see the split (#1015).
  #
  # Dependabot alone does not close that: it compares each manifest against
  # upstream, never against the other manifest, so it would have opened a PR
  # for 0.16.5 without noticing the 0.16.3/0.16.4 disagreement. The guard in
  # tests/unit/test_toolchain_version_agreement.py is the part that does.
  #
  # Bot PRs from this ecosystem must NOT be admin-merged: a ruff bump
  # can reflow the codebase, and the reflow is the thing to review.
  #
  # ruff, mypy and bandit are ignored below, so this entry no longer proposes
  # the three revs the guard compares (#1435): a hook-only bump fails the guard
  # until the lock side is moved by hand, and the weekly tool-update job
  # (maintenance.yml) moves both together. Here the dependency name is the
  # repo URL, which is how Dependabot titles these PRs (#1451, #1360). The
  # other hooks stay with Dependabot.
  - package-ecosystem: "pre-commit"
    directory: "/"
    # Retargeted from the default branch (main) to dev for the v1.1.0
    # audit campaign: every bot PR against main widens a divergence the
    # release has to fast-forward across. Revert once v1.1.0 ships.
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    reviewers:
      - "jimmy058910"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(pre-commit)"
      include: "scope"
    ignore:
      - dependency-name: "https://github.com/astral-sh/ruff-pre-commit"
      - dependency-name: "https://github.com/pre-commit/mirrors-mypy"
      - dependency-name: "https://github.com/PyCQA/bandit"

  # npm dependencies - scripts/api
  - package-ecosystem: "npm"
    directory: "/scripts/api"
    # Retargeted from the default branch (main) to dev for the v1.1.0
    # audit campaign: every bot PR against main widens a divergence the
    # release has to fast-forward across. Revert once v1.1.0 ships.
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      api-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

# Important notes:
# 1. Dependabot DOES NOT track binary tools (trivy, trufflehog, syft, etc.)
#    Those are managed via versions.yaml + update_versions.py + CI checks
# 2. Python security tools (semgrep, checkov) are tracked in the Dockerfile
#    but should be manually synced via update_versions.py after Dependabot PRs
# 3. For critical tool updates, use scripts/dev/update_versions.py directly
# 4. The weekly version check in maintenance.yml creates issues for outdated tools

schema_version: '1.0'
python_tools:
  semgrep:
    version: 1.175.0
    pypi_package: semgrep
    description: Multi-language SAST scanner
    update_check: pip index versions semgrep
    critical: true
  checkov:
    version: 3.3.16
    pypi_package: checkov
    description: IaC security scanner
    update_check: pip index versions checkov
    critical: true
  ruff:
    version: 0.16.5
    pypi_package: ruff
    description: Python linter and formatter
    update_check: pip index versions ruff
    critical: false
binary_tools:
  trufflehog:
    version: 3.97.1
    github_repo: trufflesecurity/trufflehog
    description: Verified secrets scanner (primary)
    release_pattern: trufflehog_{version}_linux_{arch}.tar.gz
    architectures:
      amd64: amd64
      arm64: arm64
    update_check: gh api repos/trufflesecurity/trufflehog/releases/latest
    critical: true
    brew_package: trufflehog
  syft:
    version: 1.51.1
    github_repo: anchore/syft
    description: SBOM generator
    release_pattern: syft_{version}_linux_{arch}.tar.gz
    architectures:
      amd64: amd64
      arm64: arm64
    update_check: gh api repos/anchore/syft/releases/latest
    critical: true
  trivy:
    version: 0.74.0
    github_repo: aquasecurity/trivy
    description: Vulnerability/misconfig/secrets scanner
    release_pattern: trivy_{version}_Linux-{arch}.tar.gz
    architectures:
      amd64: 64bit
      arm64: ARM64
    update_check: gh api repos/aquasecurity/trivy/releases/latest
    critical: true
    brew_package: trivy
    apt_package: null
    notes: 'CRITICAL: Outdated versions miss CVEs (see ROADMAP.md #14)'
  hadolint:
    version: 2.15.1
    github_repo: hadolint/hadolint
    description: Dockerfile linter
    release_pattern: hadolint-Linux-{arch}
    architectures:
      amd64: x86_64
      arm64: arm64
    update_check: gh api repos/hadolint/hadolint/releases/latest
    critical: false
    brew_package: hadolint
  shfmt:
    version: 3.14.0
    github_repo: mvdan/sh
    description: Shell formatter
    release_pattern: shfmt_v{version}_linux_{arch}
    architectures:
      amd64: amd64
      arm64: arm64
    update_check: gh api repos/mvdan/sh/releases/latest
    critical: false
  nuclei:
    version: 3.11.1
    github_repo: projectdiscovery/nuclei
    description: Fast vulnerability scanner with 4000+ templates (DAST/API security)
    release_pattern: nuclei_{version}_linux_{arch}.zip
    architectures:
      amd64: amd64
      arm64: arm64
    update_check: gh api repos/projectdiscovery/nuclei/releases/latest
    critical: false
    brew_package: nuclei
    notes: 'Requires templates update: nuclei -update-templates'
  gosec:
    version: 2.29.0
    github_repo: securego/gosec
    description: Go security analyzer
    release_pattern: gosec_{version}_linux_{arch}.tar.gz
    architectures:
      amd64: amd64
      arm64: arm64
    update_check: gh api repos/securego/gosec/releases/latest
    critical: false
    notes: v1.0.0 - Go-specific SAST
  grype:
    version: 0.118.0
    github_repo: anchore/grype
    description: Vulnerability scanner for containers/filesystems
    release_pattern: grype_{version}_linux_{arch}.tar.gz
    architectures:
      amd64: amd64
      arm64: arm64
    update_check: gh api repos/anchore/grype/releases/latest
    critical: false
    notes: v1.0.0 - Dual scanning with Trivy (Anchore DB)
special_tools:
  zap:
    version: 2.17.0
    github_repo: zaproxy/zaproxy
    description: OWASP ZAP - Dynamic Application Security Testing
    release_pattern: ZAP_{version}_Linux.tar.gz
    update_check: gh api repos/zaproxy/zaproxy/releases/latest
    critical: true
    installation: tar.gz with Java dependency
  yara:
    # Tracks the PyPI package, which is what JMo installs. It previously
    # tracked github_repo VirusTotal/yara as well - a different project with
    # its own numbering - and took `version` from there. That is how this came
    # to pin 4.5.5, which has never existed on PyPI: `jmo tools install yara`
    # failed with "no version of yara-python==4.5.5". The C project is at 4.5.8
    # and publishes prebuilt binaries for Windows only (and stopped at v4.5.6),
    # so it is not a source JMo can install from on any platform.
    version: 4.5.4
    pypi_package: yara-python
    description: Malware pattern detection (libyara engine)
    update_check: pip index versions yara-python
    critical: false
    installation: yara-python pip package (Python library, not CLI)
    notes: 'v1.0.0 - Web shells, backdoors, cryptominers (200-500 curated rules).

      NOTE: yara-python is a Python library, NOT a CLI binary. Version check

      uses ''import yara'' instead of ''yara --version''. The native yara CLI

      is a separate package from the VirusTotal/yara repo.

      '
  opa:
    version: 1.20.1
    github_repo: open-policy-agent/opa
    description: Open Policy Agent (policy-as-code engine)
    release_pattern: opa_linux_{arch}_static
    architectures:
      amd64: amd64
      arm64: arm64
    update_check: gh api repos/open-policy-agent/opa/releases/latest
    critical: true
    notes: 'v1.0.0 - Policy-as-Code feature (Feature #5)'
  shellcheck:
    version: 0.11.0
    github_repo: koalaman/shellcheck
    description: Static analysis for shell scripts
    release_pattern: shellcheck-v{version}.linux.{arch}.tar.xz
    architectures:
      amd64: x86_64
      arm64: aarch64
    update_check: gh api repos/koalaman/shellcheck/releases/latest
    critical: false
    brew_package: shellcheck
    apt_package: shellcheck
    notes: Bash/sh/ksh script security and best practices
docker_images:
  ubuntu:
    version: '24.04'
    registry: docker.io
    image: ubuntu
    description: Base image for the Dockerfile
    update_check: docker pull ubuntu:24.04 && docker inspect ubuntu:24.04 | jq -r
      '.[0].Created'
update_policies:
  critical_tools:
    tools:
    - trivy
    - trufflehog
    - semgrep
    - checkov
    - zap
    - syft
    description: Critical tools must be updated within 7 days of new release
  non_critical_tools:
    tools:
    - ruff
    - hadolint
    - shfmt
    - nuclei
    - gosec
    - grype
    - yara
    description: Non-critical tools can be updated monthly
  automated_check_schedule: Weekly (Sunday 00:00 UTC)
  manual_review_schedule: First Monday of each month

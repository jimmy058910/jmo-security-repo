[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jmo-security"
version = "1.0.6"
description = "JMo Security Audit Suite (terminal-first, multi-tool, unified outputs, multi-target scanning)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "James Moceri", email = "general@jmogaming.com" }]
keywords = [
    "security", "scanning", "SAST", "SBOM", "secrets-detection",
    "compliance", "OWASP", "CWE", "DevSecOps", "cybersecurity"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "PyYAML>=6.0",  # Required for config file loading (jmo.yml)
    "croniter>=1.0",  # Required for schedule management (v0.9.0+)
    "requests>=2.31.0",  # Required for EPSS/KEV integration (v0.9.0+)
    "rapidfuzz>=3.0.0",  # Required for cross-tool deduplication fuzzy matching (v1.0.0+)
    "rich>=13.0",  # Required for trend analysis console formatting (v1.0.0+)
]

[project.urls]
Homepage = "https://jmotools.com"
Documentation = "https://docs.jmotools.com"
Repository = "https://github.com/jimmy058910/jmo-security-repo"
"Bug Tracker" = "https://github.com/jimmy058910/jmo-security-repo/issues"
LinkedIn = "https://linkedin.com/in/jimmy-moceri"

[project.optional-dependencies]
reporting = ["jsonschema>=4.0"]  # PyYAML moved to main dependencies
email = ["resend>=2.0"]
mcp = ["mcp[cli]>=1.0.0"]  # MCP server for AI-powered remediation (Feature #2, v1.0.0)
attestation = ["sigstore>=2.0.0", "cryptography>=41.0.0"]  # SLSA attestation (Feature #6, v1.0.0)
visual = [
    "pytest-playwright>=0.5.2",
]

# PEP 735 dependency group. This is the SINGLE declaration of dev dependencies
# for this project -- install with `uv sync --group dev`.
#
# It replaces two prior sources that had already diverged: a
# `[project.optional-dependencies] dev` extra (19 packages) and
# `requirements-dev.in` (30). The extra was a strict subset, so the documented
# `pip install -e ".[dev]"` produced a smaller environment than CI used -- which
# is how PR #361 shipped a scheduled job broken by a missing pytest-benchmark.
[dependency-groups]
dev = [
    # Testing
    "pytest",
    "pytest-cov",
    "pytest-split>=0.9.0",          # Test sharding for CI parallelization
    "pytest-timeout>=2.3.0",        # Safety net to prevent infinite test hangs
    "hypothesis",
    "pytest-rerunfailures",
    "pytest-xdist>=3.5.0",          # Parallel test execution with -n auto
    "pytest-json-report>=1.5.0",    # Machine-readable test output for CI scheduled jobs
    # Performance benchmark plugin (--benchmark-json/--benchmark-only) used by
    # scheduled.yml's Performance Benchmarks job + scripts/dev/compare_benchmarks.py
    "pytest-benchmark>=4.0.0",
    # Linting & formatting
    "ruff",
    "bandit",
    "black",
    "pre-commit",
    "mypy>=2.2.0",                  # mypy 2.x -- sandbox-verified 0 errors on scripts/ (supersedes #634, #487)
    # Required for tests
    "pyyaml",
    "jsonschema",
    # Type stubs
    "types-PyYAML",
    "types-tabulate",
    "types-requests",
    "croniter",
    "types-croniter",
    # MCP Server dependencies (Feature #2: AI Remediation)
    # Capped below 2.0 to match what the pre-migration lockfile actually resolved
    # (mcp 1.28.1). mcp 2.0 replaces httpx with httpx2 and drops pydantic-settings
    # and httpx-sse, which changes ~100 tests' collection/skip status and breaks
    # tests/integration/test_cli_scan_ci.py. Adopting it is a real upgrade that
    # deserves its own PR; Dependabot will propose it as an ungrouped major bump.
    "mcp[cli]>=1.0.0,<2",           # Official Anthropic MCP SDK with FastMCP framework
    # Security floors for mcp's transitive web deps (pip-audit fixable CVEs, 2026-06):
    #   starlette>=1.3.1: CVE-2026-48817/48818/54282/54283
    #   python-multipart>=0.0.31: CVE-2026-53538/53539/53540
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    # Security floor for click (transitive via black + mcp[cli]'s typer):
    #   click>=8.3.3: PYSEC-2026-2132
    "click>=8.3.3",
    # Policy-as-Code (Feature #5). OPA binary installs separately via scripts/dev/install_tools.sh.
    "packaging",                    # Version comparison in OPA version checks
    # SLSA Attestation (Feature #6, v1.0.0)
    "sigstore>=2.0.0",              # Keyless signing (Fulcio + Rekor)
    "cryptography>=48.0.1",         # >=48.0.1: GHSA-537c-gmf6-5ccf
    # Platform-specific transitive deps kept top-level so they are guaranteed to
    # appear in the lock. uv.lock is universal, so pywin32's
    # sys_platform == "win32" marker (via mcp) is preserved natively --
    # see tests/unit/test_uv_lock_platform_coverage.py.
    "colorama",
    "pytz",
]

[project.scripts]
jmo = "scripts.cli.jmo:main"
# jmotools removed in v0.9.0 - all commands consolidated into 'jmo'

[tool.setuptools]
include-package-data = true

# Ensure LICENSE files are included in the sdist/wheel
license-files = ["LICENSE", "LICENSE-MIT", "LICENSE-APACHE"]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, gradually increase
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
# Performance optimizations
incremental = true
cache_dir = ".mypy_cache"

# Gradually increase strictness for core modules
[[tool.mypy.overrides]]
module = "scripts.core.common_finding"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "scripts.core.config"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "scripts.core.plugin_api"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "scripts.core.schema_validator"
disallow_untyped_defs = true

# Disable unused-ignore warnings for modules with optional dependency fallbacks
# These have type: ignore comments needed locally but not in all environments
[[tool.mypy.overrides]]
module = "scripts.core.dedup_enhanced"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "scripts.cli.diff_commands"
warn_unused_ignores = false

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests as performance benchmarks (deselect with '-m \"not benchmark\"')",
    "smoke: marks tests as smoke tests for released packages (deselect with '-m \"not smoke\"')",
    "requires_tools: marks tests that require external security tools installed",
    "integration: marks tests as integration tests requiring real tools and longer runtime",
    "docker: marks tests that require Docker to be running",
    "baseline: marks tests that validate against vulnerability baselines",
    "e2e: marks end-to-end tests that validate complete workflows",
    "stress: marks tests as stress tests requiring significant resources",
]
# Exclude smoke tests by default (post-release only); run with: pytest -m smoke
addopts = "-m 'not smoke'"

# Test durations file for pytest-split sharding
# Generate with: pytest --store-durations --durations-path=.test_durations
# This enables duration-based splitting for more even shard distribution

# pytest-timeout: Safety net to prevent infinite test hangs
# - Default 120s per test (most tests complete in <1s)
# - Use @pytest.mark.timeout(300) for legitimately slow tests
# - Set PYTEST_TIMEOUT=0 to disable in local debugging
timeout = 120
timeout_method = "thread"  # Works on Windows (unlike signal)
# pythonpath: Ensure tests can import 'scripts' package without PYTHONPATH env var
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["scripts"]
omit = [
    # Data-only files with no executable logic
    "scripts/core/compliance_frameworks.py",
    # CLI entry points (tested via integration tests)
    "scripts/cli/jmo.py",
    "scripts/cli/clone_from_tsv.py",
    # MCP server - separate integration
    "scripts/jmo_mcp/*",
    # Email service requires SMTP infrastructure
    "scripts/core/email_service.py",
    # Interactive wizard - difficult to test comprehensively
    "scripts/cli/wizard.py",
    "scripts/cli/wizard_flows/policy_flow.py",
    # Experimental policy engine
    "scripts/core/policy_engine.py",
    # Path sanitizers utility
    "scripts/cli/path_sanitizers.py",
    # Dev/maintenance scripts: standalone CLI tools used by maintainers
    # (update_versions, auto_merge_tool_bumps, generate_baseline, etc.).
    # Not imported by runtime code, not shipped to users via the JMo
    # Security CLI. Counting them as "runtime coverage" was distorting
    # the metric — these are tooling for the project's release/dev
    # workflow, not the security-audit tool itself.
    "scripts/dev/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "^if __name__ == ['\"]__main__['\"]:",
]
omit = [
    "scripts/cli/jmo.py",
    "scripts/cli/clone_from_tsv.py",
    "scripts/jmo_mcp/*",
    "scripts/core/email_service.py",
    "scripts/cli/wizard.py",
    "scripts/cli/wizard_flows/policy_flow.py",
    "scripts/core/policy_engine.py",
    "scripts/cli/path_sanitizers.py",
    "scripts/dev/*",
]

[tool.ruff]
# Exclude test fixtures that are intentionally vulnerable
extend-exclude = ["tests/e2e/fixtures/python/vulnerable_app.py"]

[tool.ruff.lint]
# Rule set is pinned EXPLICITLY. Without this, ruff runs its *default* rules,
# which expand between releases and retroactively redden CI on unchanged code
# (ruff 0.15.21 -> "All checks passed"; 0.16.0 -> 2409 errors, same commit).
# Pinning makes every ruff upgrade an opt-in decision instead of an ambush.
#
# Security rules (S / flake8-bandit) are deliberately NOT selected: bandit
# already owns that surface via [tool.bandit] above, with documented skips
# (B603 subprocess-without-shell is SECURE with list args). Enabling S here
# would duplicate bandit and flood CI (S101 alone = 14k hits across the suite,
# where asserts are the entire point).
select = [
    "E4",   # pycodestyle - imports
    "E7",   # pycodestyle - statements
    "E9",   # pycodestyle - runtime errors
    "F",    # pyflakes - correctness
    "I",    # isort - import ordering
    "UP",   # pyupgrade - py3.12+ modernization
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie - misc lints
    "SIM",  # flake8-simplify
    "B",    # flake8-bugbear - real bug patterns
    "BLE",  # flake8-blind-except
    "DTZ",  # flake8-datetimez - naive datetime correctness
    "LOG",  # flake8-logging
    "RSE",  # flake8-raise
    "FURB", # refurb - modernization
    "RUF",  # ruff-specific rules
    "G201", # logging .exception() over .error(exc_info=True)
    "G202", # redundant exc_info
]

# DEFERRED RULES — tracked debt, not permanent exemptions.
#
# Every rule below is selected above (so the OTHER ~170 rules in those families
# are enforced on all new code) but ignored here because it still has existing
# violations that need per-site judgment, not an autofix. Each is a one-line
# removal once its findings are cleared. Counts are as of this commit.
#
# See the tracking issue for the ordered work plan.
ignore = [
    # --- larger cleanups (do these deliberately, likely one PR each) ---
    "BLE001", # 288 - blind `except Exception`. Often CORRECT here: this is a
    #                 tool orchestrator that must survive any scanner blowing up.
    #                 Needs per-site review, not a blanket rewrite.
    "SIM117", # 213 - merge nested `with`. Mechanical but touches many files.
    "SIM102", #  52 - merge nested `if`.
    "RUF012", #  48 - mutable class default needs ClassVar. Real bug class.
    "SIM105", #  28 - contextlib.suppress over try/except/pass.
    "G201",   #  25 - logger.exception() over logger.error(exc_info=True).
    #                 (G202 stays enforced — it has no existing violations.)
    # --- small, high-value: good first cleanups ---
    "B904",   #  14 - `raise ... from err` in except (preserves context).
    "B023",   #   8 - function definition uses loop variable (classic closure bug).
    "B017",   #   7 - assertRaises(Exception) is too broad.
    "B007",   #  17 - unused loop control variable.
    "B905",   #   3 - zip() without explicit strict=.
    "DTZ005", #   9 - datetime.now() without tz.
    "DTZ011", #   2 - date.today() without tz.
    "DTZ006", #   1 - datetime.fromtimestamp() without tz.
    "RUF015", #  17 - prefer next(iter(x)) over list(x)[0].
    "RUF005", #  16 - prefer unpacking over concatenation.
    "SIM108", #  11 - ternary over if/else assignment.
    "FURB162", # 11 - redundant fromisoformat handling.
    "SIM116", #   3 - dict lookup over consecutive if.
    "SIM103", #   3 - return condition directly.
    "SIM118", #   2 - `key in dict` over `key in dict.keys()`.
    "RSE102", #   2 - unnecessary parens on raised exception.
    "FURB177", #  2 - Path.cwd() over Path().resolve().
    "FURB171", #  4 - membership test on single-item container.
    "SIM222", #   1 - expr-or-true simplification.
    "SIM201", #   1 - `!=` over `not ==`.
    "RUF059", # 159 - unused unpacked variable; needs `_` renaming per site.
    "RUF043", #  12 - pytest.raises(match=) with unescaped `.`; mechanical but
    #                 touches assertion strings — do as its own pass.
    # --- deliberate, not debt ---
    # `class X(str, Enum)` -> `StrEnum` is a real behavior change (str()/format
    # semantics) on core types like CommonFinding's Severity. Revisit
    # deliberately, not as a lint autofix.
    "UP042",
    # `__all__` in wizard_flows/__init__.py is deliberately grouped by category
    # with section comments; isort-sorting it would destroy that structure.
    "RUF022",
    # RUF001/002/003 (ambiguous unicode) fire on legitimate box-drawing and
    # typographic characters in CLI output strings.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Imports deliberately follow pytest.importorskip() / sys.path setup.
"tests/adapters/test_adapter_fuzzing.py" = ["E402"]

[tool.bandit]
exclude_dirs = [
    ".venv",
    ".venv-pypi",
    ".post-release-venv",
    "venv",
    "docs",
    "samples",
    "assets",
    "archive",
    "tests",
    "dev",
]
# Bandit skip justifications:
# B404: import subprocess - expected in CLI wrappers
# B603: subprocess without shell=True is SECURE (list args)
# B606: os.startfile - guarded and platform-specific
# B607: start_process_with_partial_path - well-known tools (git, docker, etc.)
# B110: try_except_pass - intentional for cleanup/optional ops
# B112: try_except_continue - intentional for parsing/iteration resilience
# B608: SQL injection false positives - parameterized queries used
# B101: assert_used - acceptable in dev scripts and verification
# B202: tarfile extractall - official tool downloads from trusted sources
# B324: MD5 for dedup fingerprinting, not security purposes
skips = ["B404", "B603", "B606", "B607", "B110", "B112", "B608", "B101", "B202", "B324"]
